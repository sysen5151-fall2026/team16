openapi: 3.1.0
info:
  title: PANTRI Purchase Coordination design interface contracts
  version: 1.0.0
  description: First-level contracts adapted from api-v1.json; PC-IF.01-03 from the
    2026-11-01 Innoslate snapshot. No HTTP service, durable storage or full component
    conformance is asserted. Primary product is now PANTRI_App.html. /product paths
    document actual local function arguments, not deployed HTTP routes; earlier /internal
    contracts remain reference-architecture evidence.
paths:
