    post:
      operationId: P_IF_05
      summary: Proposed Purchasing Advice
      x-flow-id: P-IF.05
      x-function-id: P-F.0.3
      x-producers:
      - P-F.0.2
      x-consumers:
      - P-F.0.3
      x-implementation: in-process FlowBus; this HTTP path is a design representation,
        not a deployed route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - restaurant_id
              - demand
              - usable_stock
              - horizon
              - limitations
              - proposed_quantities
              additionalProperties: false
              properties:
                restaurant_id:
                  type: string
                  minLength: 1
                demand:
                  type:
                  - object
                  - 'null'
                usable_stock:
                  type:
                  - object
                  - 'null'
                horizon:
                  type:
                  - number
                  - 'null'
                  minimum: 0
                limitations:
                  type: array
                proposed_quantities:
                  type:
                  - object
                  - 'null'
      responses:
        '200':
          description: In-process delivery accepted; no remote service asserted
          content:
            application/json:
              schema:
                type: object
                required:
                - accepted
                - flow
                - recipient
                properties:
                  accepted:
                    type: boolean
                  flow:
                    type: string
                  recipient:
                    type: string
