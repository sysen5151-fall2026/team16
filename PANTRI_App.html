function validateSaved(s){
  if(s?.schemaVersion!==1||!natural(s.revision)||s.restaurantId!=='restaurant-demo-1'||!validDate(s.demoDate)||!natural(s.nextId))return false;
  for(const k of ['ingredients','batches','drafts','orders','inventoryEvents','partnerEvents','recoveries','observations','operations'])if(!Array.isArray(s[k]))return false;
  for(const rows of [s.ingredients,s.batches,s.drafts,s.orders,s.inventoryEvents,s.partnerEvents,s.recoveries])if(!unique(rows))return false;
  const scoped=x=>x.restaurantId===s.restaurantId;
  const ingredient=id=>s.ingredients.find(i=>i.id===id);
  const batch=id=>s.batches.find(b=>b.id===id);
  const line=l=>!!ingredient(l.ingredientId)&&l.unit===ingredient(l.ingredientId).unit&&validQuantity(l.managerQty,l.unit,true)&&validQuantity(l.suggestedQty,l.unit,true)&&Number.isFinite(l.forecastQty)&&l.forecastQty>=0&&Number.isFinite(l.usableStock)&&l.usableStock>=0&&Number.isFinite(l.excludedStock)&&l.excludedStock>=0&&Number.isFinite(l.dailyDemand)&&l.dailyDemand>=0&&natural(l.horizonDays)&&l.horizonDays>0&&Array.isArray(l.exclusionNotes)&&l.exclusionNotes.every(x=>typeof x==='string')&&cost(l.unitCostCents);
  const history=events=>Array.isArray(events)&&events.every(e=>text(e.kind)&&timestamp(e.occurredAt));
  if(!s.ingredients.length||!s.ingredients.every(i=>scoped(i)&&text(i.name)&&['Produce','Proteins','Dry goods','Seafood','Dairy & eggs','Other'].includes(i.category)&&['kg','bag','bottle','tray'].includes(i.unit)&&validQuantity(i.reorderPoint,i.unit,true)&&validQuantity(i.packSize,i.unit)&&text(i.defaultSupplierId)&&(i.unitWeightKg===undefined||(Number.isFinite(i.unitWeightKg)&&i.unitWeightKg>0))))return false;
  if(!s.batches.every(b=>scoped(b)&&ingredient(b.ingredientId)&&validQuantity(b.quantity,ingredient(b.ingredientId).unit,true)&&(b.expiresOn===null||validDate(b.expiresOn))&&cost(b.unitCostCents)&&timestamp(b.receivedAt)&&timestamp(b.updatedAt)))return false;
  if(!s.drafts.every(d=>scoped(d)&&text(d.supplierId)&&['draft','approved'].includes(d.status)&&natural(d.version)&&d.version>0&&Array.isArray(d.lines)&&d.lines.length>0&&d.lines.every(line)&&timestamp(d.updatedAt)))return false;
  if(!s.orders.every(o=>scoped(o)&&text(o.supplierId)&&natural(o.approvedVersion)&&o.approvedVersion>0&&s.drafts.some(d=>d.id===o.sourceDraftId)&&Array.isArray(o.approvedLines)&&o.approvedLines.length>0&&o.approvedLines.every(line)&&timestamp(o.approvedAt)&&(o.sentAt===null||timestamp(o.sentAt))&&['not_sent','awaiting_confirmation','confirmed','partial','delayed','exception'].includes(o.supplierStatus)&&['not_received','partially_received','received'].includes(o.fulfillmentStatus)&&history(o.events)&&o.receivedQuantities&&typeof o.receivedQuantities==='object'&&Object.entries(o.receivedQuantities).every(([id,n])=>o.approvedLines.some(l=>l.ingredientId===id&&validQuantity(n,l.unit,true)&&n<=l.managerQty))))return false;
  if(!s.inventoryEvents.every(e=>scoped(e)&&ingredient(e.ingredientId)&&batch(e.batchId)?.ingredientId===e.ingredientId&&['receipt','usage','waste','count','collection'].includes(e.kind)&&e.unit===ingredient(e.ingredientId).unit&&Number.isFinite(e.quantityDelta)&&Number.isFinite(e.before)&&e.before>=0&&Number.isFinite(e.after)&&e.after>=0&&Math.abs(e.after-e.before-e.quantityDelta)<.000001&&cost(e.unitCostCents)&&timestamp(e.occurredAt)))return false;
  if(!s.recoveries.every(r=>scoped(r)&&text(r.partnerId)&&text(r.requestedWindow)&&['requested','accepted','exception','cancelled','collected'].includes(r.status)&&Array.isArray(r.lines)&&r.lines.length>0&&r.lines.every(l=>batch(l.batchId)?.ingredientId===l.ingredientId&&ingredient(l.ingredientId)?.unit===l.unit&&validQuantity(l.quantity,l.unit))&&history(r.events)))return false;
  for(const b of s.batches){const reserved=s.recoveries.filter(r=>!['cancelled','collected'].includes(r.status)).reduce((n,r)=>n+r.lines.filter(l=>l.batchId===b.id).reduce((a,l)=>a+l.quantity,0),0);if(reserved>b.quantity+1e-9)return false;}
  if(!s.partnerEvents.every(e=>scoped(e)&&timestamp(e.occurredAt)&&['supplier','recovery'].includes(e.partnerType)&&e.simulated===true&&(e.partnerType==='supplier'?s.orders.some(o=>o.id===e.transactionId):s.recoveries.some(r=>r.id===e.transactionId))))return false;
  if(!s.observations.every(o=>scoped(o)&&validDate(o.date)&&[o.covers,o.opportunities,o.unavailable].every(n=>n===null||natural(n))&&(o.opportunities===null||o.unavailable===null||o.unavailable<=o.opportunities)&&typeof o.observationComplete==='boolean'))return false;
  return s.operations.every(text)&&new Set(s.operations).size===s.operations.length;
}

const STORAGE_KEY='pantri.demo.v1';
function freezeTree(x){if(x&&typeof x==='object'&&!Object.isFrozen(x)){Object.freeze(x);Object.values(x).forEach(freezeTree)}return x;}
function createDemoService(storage){let state=createSeed(),problem=null,raw=null;const listeners=new Set();function load(){try{raw=storage.getItem(STORAGE_KEY);if(raw!==null){const parsed=JSON.parse(raw);if(!validateSaved(parsed))throw Error('Unsupported or damaged saved data.');state=parsed;}problem=null;}catch(e){problem=`Saved data could not be loaded: ${e.message} Download it before resetting.`;}state=freezeTree(state);}load();function notify(){for(const fn of listeners)fn(state);}return{getSnapshot:()=>state,getProblem:()=>problem,getRaw:()=>raw,subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},reload(){load();notify();return !problem},markExternalChange(){problem='Data changed in another tab. Reload the latest saved data before continuing.';notify()},commit(work){if(problem)return fail(problem,'STORAGE');try{const latest=storage.getItem(STORAGE_KEY);if(latest!==raw){problem='Data changed in another tab. Reload before saving.';notify();return fail(problem,'CONFLICT')}const result=work(state);if(!result.ok)return result;if(result.value===state)return ok(state);const next={...result.value,revision:state.revision+1};if(!validateSaved(next))return fail('Changes were not saved because the resulting record is invalid. Check the entered values.','INVALID_STATE');storage.setItem(STORAGE_KEY,JSON.stringify(next));state=freezeTree(next);raw=JSON.stringify(next);notify();return ok(state);}catch(e){return fail(`Changes were not saved: ${e.message}`,'STORAGE')}},resetDemo(){try{const next={...createSeed(),revision:state.revision+1};storage.setItem(STORAGE_KEY,JSON.stringify(next));state=freezeTree(next);raw=JSON.stringify(next);problem=null;notify();return ok(state);}catch(e){return fail(`Reset could not be saved: ${e.message}`,'STORAGE')}}};}

function captureInputs(elements){const values={};for(const el of elements){if(!el.name||el.disabled||['submit','button','reset'].includes(el.type))continue;if(['checkbox','radio'].includes(el.type)&&!el.checked)continue;values[el.name]=String(el.value??'');}return values;}
function focusHint(el){return{id:el?.id,name:el?.name,type:el?.type,form:el?.form?.dataset.form,action:el?.dataset?.action,entityId:el?.dataset?.id,kind:el?.dataset?.kind};}
function dialogControls(dialog){return dialog?[...dialog.querySelectorAll('button,input,select,textarea,summary,a[href],[tabindex="0"]')].filter(el=>!el.disabled&&el.type!=='hidden'&&el.tabIndex>=0&&el.getClientRects().length):[];}
function chooseFocusTarget(controls,hint={}){return controls.find(el=>hint.id&&el.id===hint.id)??controls.find(el=>hint.name&&el.name===hint.name&&(!hint.form||el.form?.dataset.form===hint.form))??controls.find(el=>hint.action&&el.dataset?.action===hint.action&&(!hint.entityId||el.dataset.id===hint.entityId)&&(!hint.kind||el.dataset.kind===hint.kind))??controls.find(el=>hint.type==='submit'&&el.type==='submit'&&el.form?.dataset.form===hint.form)??controls[0];}
function tabBoundaryTarget(controls,active,shift){if(!controls.length)return null;if(!controls.includes(active))return shift?controls.at(-1):controls[0];if(shift&&active===controls[0])return controls.at(-1);if(!shift&&active===controls.at(-1))return controls[0];return null;}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(c/100);
const purchaseEstimate=lines=>lines.filter(l=>l.managerQty>0).every(l=>Number.isFinite(l.unitCostCents))?money(lines.reduce((n,l)=>n+(l.managerQty>0?l.managerQty*l.unitCostCents:0),0)):'Incomplete';
const amount=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(n);
const prettyDate=d=>d?new Date(d.slice(0,10)+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}):'Unknown';
const riskLabels={healthy:'Healthy',low:'Low stock',expiring:'Expiring soon',expired:'Expired',unknown:'Date unknown',attention:'Needs attention'};
const stateLabels={draft:'Draft',approved:'Approved',not_sent:'Not sent',awaiting_confirmation:'Awaiting confirmation',confirmed:'Confirmed',partial:'Partially confirmed',delayed:'Delayed',exception:'Exception',not_received:'Not received',partially_received:'Partially received',received:'Received',requested:'Requested',accepted:'Accepted',collected:'Collected',cancelled:'Cancelled',sent:'Sent',receipt:'Received',usage:'Usage',count:'Count adjustment',waste:'Waste',collection:'Collection'};
const iconPaths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',box:'m3 7 9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10',cart:'M3 4h3l2 12h11l2-8H7M10 21h.01M18 21h.01',leaf:'M19 4c-9-1-16 5-13 12 6 5 15-2 13-12ZM6 17l8-8',chart:'M4 3v18h17M8 16v-5M13 16V7M18 16v-6',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',chevron:'m9 5 7 7-7 7',arrow:'M4 12h16m-6-6 6 6-6 6',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',alert:'m12 3 10 18H2zM12 9v4M12 17h.01',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',dollar:'M12 2v20M18 6H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6',file:'M14 2H5v20h14V7zM14 2v6h5M8 12h8M8 16h6',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',refresh:'M20 7V3l-4 4a8 8 0 1 0 4 7M20 7h-5',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',calendar:'M4 5h16v16H4zM8 2v6M16 2v6M4 10h16',send:'m3 3 19 9-19 9 4-9zM7 12h15',truck:'M2 6h12v12H2zM14 10h4l4 5v3h-8M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6M18 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6',undo:'M3 9h11a6 6 0 0 1 0 12M3 9l6-6M3 9l6 6',info:'M12 11v6M12 7h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',chevrondown:'m6 9 6 6 6-6'};
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${iconPaths[name]??iconPaths.file}"/></svg>`;
const badge=status=>`<span class="badge ${esc(status)}"><i></i>${esc(riskLabels[status]??stateLabels[status]??status)}</span>`;
const empty=(title,text,action='')=>`<div class="empty-state">${icon('box')}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;
const button=(label,action,attrs='',kind='secondary',ico='')=>`<button type="button" class="btn ${kind}" data-action="${action}" ${attrs}>${ico?icon(ico):''}${label}</button>`;
const heading=(kicker,title,sub,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="heading-actions">${actions}</div></div>`;
const categoryIcon=c=>c==='Produce'?'leaf':c==='Other'?'dollar':'box';

function healthChart(summary,animate){const order=['healthy','expiring','low','expired','unknown'];return`<div class="health-score"><strong>${Math.round((summary.statuses.healthy/Math.max(1,summary.total))*100)}<span>%</span></strong><div>in good standing<br><small>${summary.statuses.healthy} of ${summary.total} ingredients</small></div></div><div class="health-stack ${animate?'chart-entry':''}" aria-label="Inventory health by primary status">${order.filter(k=>summary.statuses[k]).map(k=>`<button type="button" class="health-segment ${k}" style="flex:${summary.statuses[k]}" data-action="filter" data-risk="${k}" aria-label="${riskLabels[k]}: ${summary.statuses[k]} ingredients"><span class="chart-tooltip">${riskLabels[k]}<b>${summary.statuses[k]} ingredients · open list</b><small>Primary status count. Risk lists can include overlapping flags.</small><b></b></span></button>`).join('')}</div><div class="chart-legend">${order.filter(k=>summary.statuses[k]).map(k=>`<span><i class="dot ${k}"></i><b>${summary.statuses[k]}</b> ${riskLabels[k]}</span>`).join('')}</div><div class="category-label">INGREDIENTS BY CATEGORY <span>Number of tracked ingredients</span></div><div class="category-grid">${summary.categories.map(c=>`<button type="button" class="category-row" data-action="category" data-category="${esc(c.category)}" aria-label="${esc(c.category)}: ${c.count} ingredients"><span>${esc(c.category)}</span><span class="category-track"><i style="width:${c.count/Math.max(...summary.categories.map(x=>x.count))*100}%"></i></span><b>${c.count}</b><span class="chart-tooltip">${esc(c.category)}<b>${c.count} of ${summary.total} ingredients · open list</b></span></button>`).join('')}</div>`;}
function costChart(series,animate=false){const max=Math.max(1000,...series.map(p=>Math.max(p.usageCents,p.wasteCents)));const top=Math.ceil(max/1000)*1000;const pts=series.map((p,i)=>`${((i+.5)/series.length*100).toFixed(2)},${(100-p.wasteCents/top*100).toFixed(2)}`).join(' ');return`<div class="cost-chart ${animate?'chart-entry':''}"><div class="chart-axis"><span>${money(top).replace('.00','')}</span><span>${money(top/2).replace('.00','')}</span><span>$0</span></div><div class="plot"><div class="plot-lines"><i></i><i></i><i></i></div><div class="plot-columns">${series.map(p=>`<div class="plot-column" tabindex="0" role="img" aria-label="${p.date}: usage ${money(p.usageCents)}, waste ${money(p.wasteCents)}"><div class="usage-bar" style="height:${p.usageCents/top*100}%"></div><span class="chart-tooltip">${prettyDate(p.date)}<b>Usage ${money(p.usageCents)}</b><b>Waste ${money(p.wasteCents)}</b>${!p.costComplete?'<b>Incomplete cost data</b>':''}</span><span class="x-label">${prettyDate(p.date)}</span></div>`).join('')}</div><svg class="waste-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/>${series.map((p,i)=>`<circle cx="${(i+.5)/series.length*100}" cy="${100-p.wasteCents/top*100}" r="1.1"/>`).join('')}</svg></div></div><div class="chart-legend cost-legend"><span><i class="dot healthy"></i>Usage cost</span><span><i class="dot expiring"></i>Waste cost</span><small>${series.every(p=>p.costComplete)?'Same dollar scale':'Partial costs · unknown costs excluded'}</small></div>`;}

function renderOverview(s,ui){const v=selectOverview(s),exp=v.items.filter(i=>i.risks.includes('expiring')).length,low=v.items.filter(i=>i.risks.includes('low')).length;const stat=(label,value,foot,ico,action,attrs='',warn=false)=>`<${action?'button type="button"':'div'} class="metric ${action?'interactive':''}" ${action?`data-action="${action}" ${attrs}`:''}><div class="metric-label">${esc(label)}${icon(ico,warn?'warning':'')}</div><div class="metric-value ${ui.highlight?'value-changed':''}">${value}</div><div class="metric-foot">${foot}</div></${action?'button':'div'}>`;const work=(ico,title,sub,action,attrs='',warn=false)=>`<div class="action-row">${icon(ico,warn?'warning':'green')}<div><strong>${title}</strong><p>${sub}</p></div>${button('Open',action,attrs,'mini')}</div>`;const recents=selectActivity(s).slice(0,3);return heading('Your workspace','Overview','A clear picture of your restaurant, before the next service.',`<span class="date-control">${icon('calendar')} Wed, October 21</span>${button('View inventory','inventory','','primary','arrow')}`)+`<div class="metrics">${stat('Tracked ingredients',v.total,`Across <b>${v.categories.length} categories</b>`,'box','inventory')}${stat('Inventory value',money(v.valueCents),v.costCovered===v.total?'Estimated on-hand value':`Cost coverage: ${v.costCovered}/${v.total} ingredients`,'dollar')}${stat('Needs attention',v.attention,`<b>${low} low stock</b> · ${exp} expiring soon`,'alert','filter','data-risk="attention"',true)}${stat('Purchase drafts',v.drafts,'Awaiting <b>manager review</b>','file','purchasing')}</div><div class="dashboard-grid"><section class="card health-card"><div class="card-head"><div><h2>Inventory health</h2><p>A quick view across all ${v.total} ingredients</p></div>${button('Explore inventory →','inventory','','link')}</div><div class="card-body">${healthChart(v,ui.animateCharts)}</div></section><section class="card actions-card"><div class="card-head"><div><h2>Action center</h2><p>Decisions for your next service</p></div><span class="counter">${v.drafts+v.pendingReceipts+exp+low}</span></div>${work('file',`Review ${v.drafts} purchase draft${v.drafts===1?'':'s'}`,'Check recommendations and approve final quantities.','purchasing')}${work('clock',`${exp} ingredients expiring soon`,'Plan their use within the next three days.','filter','data-risk="expiring"',true)}${work('alert',`Check ${low} low-stock ingredients`,'Confirm quantities before the next order.','filter','data-risk="low"',true)}${work('truck',`${v.pendingReceipts} orders awaiting receiving`,'Keep confirmation and receiving separate.','orders')}</section><section class="card trend-card"><div class="card-head"><div><h2>Usage & waste cost</h2><p>Last 7 demo days · ingredient value in USD</p></div>${button('Open reports →','reports','','link')}</div><div class="card-body">${costChart(selectCostSeries(s,{start:addDays(s.demoDate,-6),end:s.demoDate}),ui.animateCharts)}</div></section><section class="card activity-card"><div class="card-head"><div><h2>Recent activity</h2><p>Latest changes to restaurant records</p></div></div>${recents.map(e=>{const i=s.ingredients.find(i=>i.id===e.ingredientId);return`<div class="activity-row"><span class="activity-dot ${e.kind==='waste'?'orange':''}"></span><div><strong>${esc(stateLabels[e.kind]??e.kind)}</strong><p>${esc(e.detail)}</p></div><time>${prettyDate(e.occurredAt)}<small>${e.occurredAt.slice(11,16)}</small></time></div>`}).join('')}<div class="card-footer">${button('Browse inventory records','inventory','','link','arrow')}</div></section></div><p class="fineprint">Synthetic restaurant records · ${prettyDate(s.demoDate)}, 2026 · Original inventory units are preserved.</p>`;}
function renderInventory(s,ui){const f=ui.filter,all=selectInventory(s,f),size=ui.pageSize;ui.pageNumber=Math.max(1,Math.min(ui.pageNumber,Math.ceil(all.length/size)||1));const start=(ui.pageNumber-1)*size,rows=all.slice(start,start+size),categories=[...new Set(s.ingredients.map(i=>i.category))];const active=!!(f.query||f.category||f.risk);return heading('Restaurant / Inventory','Inventory','Every ingredient, batch and stock movement in one place.',button('Receive delivery','record','data-kind="receipt"','primary','plus'))+`<div class="inventory-toolbar"><label class="search-field">${icon('search')}<input id="inventory-search" data-focus="inventory-search" type="search" placeholder="Search ingredients or categories…" value="${esc(f.query??'')}" aria-label="Search ingredients"></label><select id="category-filter" aria-label="Category"><option value="">All categories</option>${categories.map(c=>`<option ${f.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="risk-filter" aria-label="Status"><option value="">All statuses</option>${Object.entries(riskLabels).map(([v,l])=>`<option value="${v}" ${f.risk===v?'selected':''}>${l}</option>`).join('')}</select>${active?button('Clear filters','clear-filters','','ghost','close'):''}</div><div class="table-meta"><span><b>${all.length}</b> of ${s.ingredients.length} ingredients ${f.risk?`<span class="filter-pill">${riskLabels[f.risk]}</span>`:''}</span><span>Recorded stock · ${prettyDate(s.demoDate)}</span></div><div class="table-card"><div class="table-scroll"><table><thead><tr><th>Ingredient</th><th>Category</th><th class="num">On hand</th><th>Unit</th><th>Nearest expiration</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr><td><button type="button" class="ingredient-button" data-action="ingredient" data-id="${i.id}"><span class="item-icon">${icon(categoryIcon(i.category))}</span><span><strong>${esc(i.name)}</strong><small>${i.batches.length} batch${i.batches.length===1?'':'es'} · ${esc(i.id.toUpperCase())}</small></span></button></td><td>${esc(i.category)}</td><td class="num stock-quantity">${amount(i.onHand)}</td><td>${esc(i.unit)}</td><td>${i.risks.includes('unknown')?'<span class="muted">Unknown date present</span>':prettyDate(i.nearest)}</td><td>${badge(i.status)}${i.risks.length>1?`<small class="more-risks" title="${esc(i.risks.map(r=>riskLabels[r]).join(', '))}">+${i.risks.length-1}</small>`:''}</td><td>${prettyDate(i.updatedAt)}</td><td>${button(icon('chevron'),'ingredient',`data-id="${i.id}" aria-label="Open ${esc(i.name)}"`,'icon-button')}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('No matching ingredients','Try a different search, category or status.',button('Clear filters','clear-filters','','secondary'))}<div class="pagination"><span>${all.length?start+1:0}–${Math.min(start+size,all.length)} of ${all.length}</span><div><label>Rows <select id="page-size" aria-label="Rows per page">${[12,24,48].map(n=>`<option ${size===n?'selected':''}>${n}</option>`).join('')}</select></label>${button('Previous','prev',ui.pageNumber===1?'disabled':'','mini') }<span class="page-index">${ui.pageNumber} / ${Math.ceil(all.length/size)||1}</span>${button('Next','next',start+size>=all.length?'disabled':'','mini')}</div></div></div>`;}
function renderPurchasing(s,ui){const drafts=s.drafts.filter(d=>d.status==='draft'),orders=[...s.orders].reverse();const tab=ui.purchaseTab;return heading('Restaurant / Purchasing','Purchasing','Review the recommendation. Make the final decision.',button('Recalculate drafts','refresh-drafts','','secondary','refresh'))+`<div class="tabs"><button type="button" data-action="purchase-tab" data-tab="drafts" class="${tab==='drafts'?'selected':''}">Recommendations & drafts <span>${drafts.length}</span></button><button type="button" data-action="purchase-tab" data-tab="orders" class="${tab==='orders'?'selected':''}">Orders <span>${orders.length}</span></button></div>${tab==='drafts'?`<div class="notice">${icon('info')}<span>Recommendations use recorded stock and a two-day demand estimate. Quantities remain drafts until you explicitly approve them.</span></div><div class="draft-grid">${drafts.map(d=>`<article class="card draft-card"><div class="draft-supplier">${icon('truck')}<span>${esc(d.supplierId)}</span>${badge('draft')}</div><div class="draft-body"><div class="eyebrow">${esc(d.id.toUpperCase())} · VERSION ${d.version}</div><h2>${esc(s.ingredients.find(i=>i.id===d.lines[0].ingredientId).name)}</h2><p>${d.lines.length} ingredient${d.lines.length===1?'':'s'} · 2-day planning window</p><div class="draft-calculation"><div><small>Forecast demand</small><b>${amount(d.lines[0].forecastQty)} <em>${d.lines[0].unit}</em></b></div><span>−</span><div><small>Usable stock</small><b>${amount(d.lines[0].usableStock)} <em>${d.lines[0].unit}</em></b></div><span>=</span><div class="suggested"><small>Suggested</small><b>${amount(d.lines[0].suggestedQty)} <em>${d.lines[0].unit}</em></b></div></div></div><div class="draft-bottom"><div><small>Draft estimate</small><b>${purchaseEstimate(d.lines)}</b></div>${button('Review draft','draft',`data-id="${d.id}"`,'primary','arrow')}</div></article>`).join('')}</div>${!drafts.length?empty('All drafts reviewed','Approved orders are ready in the Orders tab.',button('View orders','orders','','primary')):''}`:orders.length?`<div class="table-card"><div class="table-scroll"><table><thead><tr><th>Order / Supplier</th><th>Approved amount</th><th>Supplier status</th><th>Receiving</th><th>Approved</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><strong>${esc(o.id)}</strong><small class="block muted">${esc(o.supplierId)}</small></td><td>${o.approvedLines.map(l=>`${amount(l.managerQty)} ${esc(l.unit)}`).join(' · ')}</td><td>${badge(o.supplierStatus)}</td><td>${badge(o.fulfillmentStatus)}</td><td>${prettyDate(o.approvedAt)}</td><td>${button('View order','order',`data-id="${o.id}"`,'mini','chevron')}</td></tr>`).join('')}</tbody></table></div></div>`:empty('No orders yet','Review a purchase draft and explicitly approve the final quantities.',button('Review drafts','purchase-tab','data-tab="drafts"','primary'))}`;}
function renderWaste(s,ui){const recovery=ui.wasteTab==='recovery';const period={start:addDays(s.demoDate,-6),end:s.demoDate},r=calculateReport(s,period),events=s.inventoryEvents.filter(e=>e.kind==='waste').sort((a,b)=>b.occurredAt.localeCompare(a.occurredAt));const requests=[...s.recoveries].reverse();return heading('Restaurant / Waste & recovery','Waste & recovery','Record what leaves inventory, and coordinate surplus recovery.',recovery?button('New recovery request','new-recovery','','primary','plus'):button('Record waste','record','data-kind="waste"','primary','plus'))+`<div class="tabs"><button type="button" data-action="waste-tab" data-tab="waste" class="${!recovery?'selected':''}">Waste log</button><button type="button" data-action="waste-tab" data-tab="recovery" class="${recovery?'selected':''}">Recovery requests <span>${requests.length}</span></button></div>${recovery?`<div class="notice">${icon('leaf')}<span>A request reserves inventory. A partner response does not mean collection is complete. Record collection separately.</span></div>${requests.length?`<div class="recovery-grid">${requests.map(x=>{const l=x.lines[0],i=s.ingredients.find(i=>i.id===l.ingredientId);return`<article class="card recovery-card"><div class="card-head"><div><div class="eyebrow">${esc(x.id)}</div><h2>${esc(i.name)}</h2></div>${badge(x.status)}</div><div class="card-body"><div class="recovery-amount">${amount(l.quantity)} <span>${l.unit}</span></div><p>${esc(x.partnerId)}</p><p class="muted">${icon('clock')} ${esc(x.requestedWindow)}</p><p class="muted">${['collected','cancelled'].includes(x.status)?'No active reservation':'Quantity reserved from '+esc(l.batchId)}</p></div><div class="card-footer">${button('View request','recovery',`data-id="${x.id}"`,'secondary','arrow')}</div></article>`}).join('')}</div>`:empty('A second use for surplus','Create a request, simulate a partner response, then record collection.',button('Create a recovery request','new-recovery','','primary','plus'))}`:`<div class="metrics three"><div class="metric"><div class="metric-label">Waste recorded · last 7 days ${icon('file')}</div><div class="metric-value">${r.wasteMassComplete?amount(r.wasteKg)+' <small>kg</small>':'Incomplete'}</div><div class="metric-foot">${r.wasteMassComplete?r.wasteEntries+' entries · converted mass':'Known mass: '+amount(r.wasteKg)+' kg; conversion missing for other records'}</div></div><div class="metric"><div class="metric-label">Waste cost ${icon('dollar')}</div><div class="metric-value">${r.wasteCostComplete?money(r.series.reduce((n,p)=>n+p.wasteCents,0)):'Incomplete'}</div><div class="metric-foot">${r.wasteCostComplete?'At recorded unit-cost snapshots':'Some recorded unit costs are unknown'}</div></div><div class="metric"><div class="metric-label">Active recoveries ${icon('leaf')}</div><div class="metric-value">${requests.filter(x=>!['collected','cancelled'].includes(x.status)).length}</div><div class="metric-foot">Reserved inventory, tracked separately</div></div></div><div class="table-meta"><span><b>${events.length}</b> waste entries</span><span>Most recent first</span></div><div class="table-card"><div class="table-scroll"><table><thead><tr><th>Ingredient</th><th>Batch</th><th>Quantity</th><th>Reason</th><th>Cost</th><th>Recorded</th></tr></thead><tbody>${events.slice(0,40).map(e=>`<tr><td><strong>${esc(s.ingredients.find(i=>i.id===e.ingredientId)?.name)}</strong></td><td>${esc(e.batchId)}</td><td>${amount(Math.abs(e.quantityDelta))} ${esc(e.unit)}</td><td>${esc(e.reason)}</td><td>${Number.isFinite(e.unitCostCents)?money(Math.abs(e.quantityDelta)*e.unitCostCents):'Unknown'}</td><td>${prettyDate(e.occurredAt)} · ${e.occurredAt.slice(11,16)}</td></tr>`).join('')}</tbody></table></div></div>`}`;}
function renderReports(s,ui){const range={start:ui.reportPeriod==='today'?s.demoDate:addDays(s.demoDate,-6),end:s.demoDate},r=calculateReport(s,range);return heading('Restaurant / Reports','Reports','Waste and availability, evaluated over the same period.',`<select id="report-period" aria-label="Report period"><option value="week" ${ui.reportPeriod==='week'?'selected':''}>Last 7 demo days</option><option value="today" ${ui.reportPeriod==='today'?'selected':''}>Today</option></select>${button('Export data','export','','secondary','download')}`)+`<div class="report-range">${icon('calendar')} ${prettyDate(range.start)}–${prettyDate(range.end)}, 2026 <span>Demo Buffet Hot Pot</span><span>${r.coverage}/${r.days} days observed</span></div><div class="metrics report-metrics"><div class="metric"><div class="metric-label">Waste per 100 covers ${icon('leaf')}</div><div class="metric-value report-number">${r.wastePer100.value===null?'Not calculable':r.wastePer100.value.toFixed(2)+' <small>kg</small>'}</div><div class="metric-foot">${esc(r.wastePer100.reason??`${amount(r.wasteKg)} kg waste ÷ ${r.covers} covers × 100`)}</div></div><div class="metric"><div class="metric-label">Stockout rate ${icon('alert')}</div><div class="metric-value report-number">${r.stockoutRate.value===null?'Not calculable':r.stockoutRate.value.toFixed(2)+'<small>%</small>'}</div><div class="metric-foot">${esc(r.stockoutRate.reason??`${r.unavailable} unavailable ÷ ${r.opportunities} observed opportunities`)}</div></div><div class="metric"><div class="metric-label">Diner covers ${icon('file')}</div><div class="metric-value">${amount(r.covers)}</div><div class="metric-foot">Recorded for the selected period</div></div><div class="metric"><div class="metric-label">Observation coverage ${icon('check')}</div><div class="metric-value">${r.coverage}<small> / ${r.days} days</small></div><div class="metric-foot">Incomplete periods are identified</div></div></div><div class="dashboard-grid"><section class="card trend-card"><div class="card-head"><div><h2>Usage & waste cost</h2><p>Amounts use the unit cost recorded with each movement</p></div></div><div class="card-body">${costChart(r.series)}</div></section><section class="card"><div class="card-head"><div><h2>Reading these numbers</h2><p>Context behind the measures</p></div></div><div class="report-context"><div>${icon('leaf')}<p><strong>Waste intensity</strong>Compares recorded waste mass with the number of diners served.</p></div><div>${icon('box')}<p><strong>Availability</strong>Counts unavailable demand opportunities, rather than low-stock ingredients.</p></div><div>${icon('info')}<p><strong>Demonstration data</strong>These synthetic records demonstrate the workflow. They do not establish a measured reduction in waste.</p></div></div></section></div>`;}

const field=(o,name,label,value='',type='text',attrs='')=>`<label class="field"><span>${label}</span><input name="${name}" id="field-${name}" type="${type}" value="${esc(o.values?.[name]??value)}" ${attrs}></label>`;
const selectField=(o,name,label,options,defaultValue='')=>{const v=o.values?.[name]??defaultValue;return`<label class="field"><span>${label}</span><select name="${name}" id="field-${name}">${options.map(x=>{const value=typeof x==='object'?x.value:x,text=typeof x==='object'?x.label:x;return`<option value="${esc(value)}" ${String(v)===String(value)?'selected':''}>${esc(text)}</option>`}).join('')}</select></label>`;};
const noteField=(o,name,label,value='',required=false)=>`<label class="field"><span>${label}</span><textarea name="${name}" id="field-${name}" rows="3" ${required?'required':''}>${esc(o.values?.[name]??value)}</textarea></label>`;
const timeline=events=>`<div class="timeline">${[...events].sort((a,b)=>a.occurredAt.localeCompare(b.occurredAt)).map(e=>`<div class="timeline-event"><span>${icon('check')}</span><div><strong>${esc(stateLabels[e.kind]??e.kind)}${e.simulated?' <small class="sim-label">Simulated</small>':''}</strong><p>${esc(e.note??e.reason??'')}</p><time>${prettyDate(e.occurredAt)} · ${e.occurredAt.slice(11,19)}</time></div></div>`).join('')}</div>`;
function ingredientOverlay(s,o){const i=getIngredientSummary(s,o.id);return{title:i.name,sub:`${i.category} · ${i.id.toUpperCase()}`,body:`<div class="drawer-summary"><div><small>Recorded on hand</small><b id="detail-onhand">${amount(i.onHand)} <em>${i.unit}</em></b></div>${badge(i.status)}</div><div class="summary-strip"><span>Usable now <b>${amount(i.usableStock)} ${i.unit}</b></span><span>Reserved <b>${amount(i.reserved)} ${i.unit}</b></span><span>Reorder point <b>${amount(i.reorderPoint)} ${i.unit}</b></span></div><div class="drawer-actions">${button('Receive','record',`data-kind="receipt" data-ingredient="${i.id}"`,'secondary','plus')}${button('Usage','record',`data-kind="usage" data-ingredient="${i.id}"`,'secondary')}${button('Count','record',`data-kind="count" data-ingredient="${i.id}"`,'secondary')}${button('Waste','record',`data-kind="waste" data-ingredient="${i.id}"`,'secondary')}</div><h3 class="section-heading">Stock by batch <span>${i.batches.length}</span></h3>${i.batches.map(b=>`<div class="batch-card"><div><strong>${esc(b.id)}</strong><b>${amount(b.quantity)} ${i.unit}</b></div><p>Expiration <span>${b.expiresOn?prettyDate(b.expiresOn)+', '+b.expiresOn.slice(0,4):'Unknown'}</span></p><p>Unit cost <span>${b.unitCostCents===null?'Unknown':money(b.unitCostCents)}</span></p><p>Reserved <span>${amount(reservedForBatch(s,b.id))} ${i.unit}</span></p></div>`).join('')}<h3 class="section-heading">Recent movements</h3><div class="movement-list">${s.inventoryEvents.filter(e=>e.ingredientId===i.id).sort((a,b)=>b.occurredAt.localeCompare(a.occurredAt)).slice(0,12).map(e=>`<div class="movement"><span class="movement-symbol ${e.quantityDelta<0?'out':''}">${icon(e.quantityDelta<0?'arrow':'plus')}</span><div><strong>${esc(stateLabels[e.kind]??e.kind)}</strong><p>${esc(e.reason)} · ${prettyDate(e.occurredAt)}</p><small>${esc(e.batchId)} · ${amount(e.before)} → ${amount(e.after)} ${i.unit}</small></div><b>${e.quantityDelta>=0?'+':''}${amount(e.quantityDelta)} <small>${i.unit}</small></b></div>`).join('')}</div>`};}
function recordOverlay(s,o){const order=o.orderId?s.orders.find(x=>x.id===o.orderId):null;let ingredients=s.ingredients;if(order)ingredients=ingredients.filter(i=>order.approvedLines.some(l=>l.ingredientId===i.id&&l.managerQty>(order.receivedQuantities[i.id]??0)));const ingredientId=o.values?.ingredientId??o.ingredientId??ingredients[0]?.id;const i=s.ingredients.find(i=>i.id===ingredientId)??ingredients[0];const batches=s.batches.filter(b=>b.ingredientId===i.id),batch=batches.find(b=>b.id===(o.values?.batchId??o.batchId))??batches[0];const receipt=o.kind==='receipt',count=o.kind==='count';const remaining=order?order.approvedLines.find(l=>l.ingredientId===i.id).managerQty-(order.receivedQuantities[i.id]??0):null;const title=receipt?'Record receiving':count?'Count adjustment':o.kind==='waste'?'Record waste':'Record ingredient usage';return{title,sub:order?`${order.id} · Record actual quantities received`:i.name,body:`<form data-form="inventory-record"><div class="form-intro">${icon(receipt?'truck':count?'box':o.kind==='waste'?'leaf':'file')}<p>${receipt?'Recording receiving adds stock to a new batch. Supplier confirmation alone does not change inventory.':count?'Enter the absolute quantity you counted. The difference is saved as a correction, preserving history.':'This creates a movement against the selected batch and updates recorded inventory.'}</p></div>${selectField(o,'ingredientId','Ingredient',ingredients.map(i=>({value:i.id,label:i.name})),i.id)}${!receipt?selectField(o,'batchId','Batch',batches.map(b=>({value:b.id,label:`${b.id} · ${amount(b.quantity-reservedForBatch(s,b.id))} ${i.unit} available`})),batch?.id):''}${field(o,count?'countedQuantity':'quantity',`${count?'Counted quantity':'Quantity'} (${i.unit})`,count?batch?.quantity:remaining??1,'number',`required min="${count?0:i.unit==='kg'?.001:1}" step="${i.unit==='kg'?.001:1}" ${remaining!==null?`max="${remaining}"`:''}`)}${remaining!==null?`<p class="field-help">${remaining} ${i.unit} remaining on the approved order.</p>`:''}${receipt?`<div class="field-grid">${field(o,'expiresOn','Expiration date',addDays(s.demoDate,7),'date')}${field(o,'unitCost','Cost per '+i.unit+' ($)',Number.isFinite(batch?.unitCostCents)?batch.unitCostCents/100:'','number','required min="0" max="10000000" step="0.01"')}</div><p class="field-help">Leave expiration blank to explicitly record an unknown date.</p>`:''}${o.kind==='waste'?selectField(o,'reason','Reason',['Preparation loss','Spoilage','Overproduction','Expired','Other'],'Preparation loss'):noteField(o,'reason',count?'Reason for correction':'Reason / receiving note',receipt?'Delivery recorded':count?'Physical count':'Service usage',!receipt)}${o.kind==='waste'?noteField(o,'note','Additional note (optional)'):''}<div class="form-footer">${button('Cancel','close-overlay','','secondary')}<button class="btn primary" type="submit">${icon('check')}Save ${receipt?'receiving':count?'count':o.kind}</button></div></form>`};}
function draftOverlay(s,o){const d=s.drafts.find(x=>x.id===o.id);return{title:'Review purchase draft',sub:`${d.supplierId} · ${d.id.toUpperCase()} · Version ${d.version}`,body:`<div class="notice compact">${icon('info')}<span>Demo forecast: daily demand × 2 days. The recommendation stays a draft until you approve it.</span></div><form data-form="draft"><input type="hidden" name="version" value="${d.version}">${d.lines.map(l=>{const i=s.ingredients.find(i=>i.id===l.ingredientId);return`<h3 class="section-heading">${esc(i.name)}</h3><div class="math-list"><div><span>Expected demand · ${l.horizonDays} days</span><b>${amount(l.forecastQty)} ${l.unit}</b></div><div><span>Usable recorded stock</span><b>${amount(l.usableStock)} ${l.unit}</b></div><div><span>Excluded from planning</span><b>${amount(l.excludedStock)} ${l.unit}</b></div><div class="math-total"><span>Suggested purchase</span><b>${amount(l.suggestedQty)} ${l.unit}</b></div></div>${l.exclusionNotes.length?`<p class="field-help">${esc(l.exclusionNotes.join('; '))}</p>`:''}${field(o,'qty_'+i.id,`Manager quantity (${l.unit})`,l.managerQty,'number',`required min="0" step="${l.unit==='kg'?.001:1}"`)}<p class="field-help">Pack size ${i.packSize} ${i.unit}. You can revise the suggested amount before approving.</p>`}).join('')}<div class="inline-actions"><button type="submit" class="btn secondary">Save changes</button>${button('Refresh recommendation','refresh-draft',`data-id="${d.id}"`,'ghost','refresh')}</div></form><div class="approval-callout"><div><strong>Ready to approve?</strong><p>Review the final quantities in a separate confirmation.</p></div>${button('Review & approve','review-approval',`data-id="${d.id}"`,'primary','arrow')}</div>`};}
function approvalOverlay(s,o){const d=s.drafts.find(x=>x.id===o.id);return{title:'Approve final purchase',sub:`${d.supplierId} · Version ${d.version}`,center:true,body:`<div class="confirmation-icon">${icon('file')}</div><p class="confirmation-intro">You are approving the exact quantities below. Sending will use this approved snapshot.</p><div class="approved-lines">${d.lines.filter(l=>l.managerQty>0).map(l=>`<div><span>${esc(s.ingredients.find(i=>i.id===l.ingredientId).name)}<small class="block muted">${l.unitCostCents===null?'Unit cost unknown':money(l.unitCostCents)+' / '+l.unit}</small></span><b>${amount(l.managerQty)} ${l.unit}</b></div>`).join('')}</div><div class="math-list"><div><span>Estimated total</span><b>${purchaseEstimate(d.lines)}</b></div></div><p class="field-help">Manager: MC · Demo supplier handoff. Approval, sending, supplier response and receiving are recorded separately.</p><div class="form-footer">${button('Back to draft','back-draft',`data-id="${d.id}"`,'secondary')}${button('Approve & send (demo)','approve-send',`data-id="${d.id}" data-version="${d.version}"`,'primary','send')}</div>`};}
function orderOverlay(s,o){const x=s.orders.find(x=>x.id===o.id);const allEvents=[...x.events,...s.inventoryEvents.filter(e=>e.relatedOrderId===x.id).map(e=>({...e,note:`${amount(e.quantityDelta)} ${e.unit} receiving recorded in ${e.batchId}`}))];return{title:x.id,sub:x.supplierId,body:`<div class="status-pair"><div><small>Supplier</small>${badge(x.supplierStatus)}</div><div><small>Receiving</small>${badge(x.fulfillmentStatus)}</div></div><h3 class="section-heading">Approved snapshot <span>v${x.approvedVersion}</span></h3><div class="approved-lines">${x.approvedLines.map(l=>`<div><span>${esc(s.ingredients.find(i=>i.id===l.ingredientId).name)}<small class="block muted">Received ${amount(x.receivedQuantities[l.ingredientId]??0)} ${l.unit}</small></span><b>${amount(l.managerQty)} ${l.unit}</b></div>`).join('')}</div><div class="drawer-actions">${!x.sentAt?button('Send approved order (demo)','send-order',`data-id="${x.id}"`,'primary','send'):x.fulfillmentStatus!=='received'?button('Record receiving','receive-order',`data-id="${x.id}"`,'primary','truck'):''}</div>${x.sentAt?`<details class="simulation-panel" ${x.supplierStatus==='awaiting_confirmation'?'open':''}><summary>${icon('settings')} Simulate supplier response <span class="sim-label">Demo control</span></summary><form data-form="supplier"><div class="field-grid">${selectField(o,'kind','Response',[{value:'confirmed',label:'Confirm order'},{value:'partial',label:'Partially confirm'},{value:'delayed',label:'Report delay'},{value:'exception',label:'Report exception'}],'confirmed')}${field(o,'note','Response / follow-up note',x.followUp||'Supplier response recorded')}</div><p class="field-help">Owner: ${esc(x.owner)}. A simulated response does not add inventory or change the approved quantities.</p><button type="submit" class="btn secondary">Apply simulated response</button></form></details>`:''}${button('Create follow-up draft','new-draft-from-order',`data-id="${x.id}"`,'secondary','plus')}<h3 class="section-heading">Order timeline</h3>${timeline(allEvents)}`};}
function recoveryForm(s,o){const i=s.ingredients.find(i=>i.id===(o.values?.ingredientId??o.ingredientId??'ing-001'));const batches=s.batches.filter(b=>b.ingredientId===i.id);return{title:'New recovery request',sub:'Coordinate a pickup for recorded surplus',body:`<form data-form="recovery-request">${selectField(o,'ingredientId','Ingredient',s.ingredients.map(i=>({value:i.id,label:i.name})),i.id)}${selectField(o,'batchId','Batch',batches.map(b=>({value:b.id,label:`${b.id} · ${amount(b.quantity-reservedForBatch(s,b.id))} ${i.unit} available`})),batches[0]?.id)}${field(o,'quantity',`Quantity (${i.unit})`,1,'number',`required min="${i.unit==='kg'?.001:1}" step="${i.unit==='kg'?.001:1}"`)}${field(o,'partnerId','Recovery partner','Community Food Recovery','text','required maxlength="120"')}${field(o,'requestedWindow','Pickup window','Today, 14:00–16:00','text','required maxlength="120"')}${noteField(o,'note','Coordination notes','',false)}<p class="field-help">Only known, nonexpired batches can be requested. This reserves quantity; it does not record collection or certify food safety.</p><div class="form-footer">${button('Cancel','close-overlay','','secondary')}<button type="submit" class="btn primary">Create request</button></div></form>`};}
function recoveryOverlay(s,o){const r=s.recoveries.find(x=>x.id===o.id),l=r.lines[0],i=s.ingredients.find(i=>i.id===l.ingredientId),active=!['cancelled','collected'].includes(r.status);return{title:r.id,sub:r.partnerId,body:`<div class="drawer-summary"><div><small>${esc(i.name)}</small><b>${amount(l.quantity)} <em>${l.unit}</em></b></div>${badge(r.status)}</div><div class="batch-card"><p>Batch <span>${esc(l.batchId)}</span></p><p>Pickup window <span>${esc(r.requestedWindow)}</span></p><p>Responsible owner <span>${esc(r.owner)}</span></p><p>Follow-up <span>${esc(r.followUp||'No open follow-up')}</span></p></div><div class="drawer-actions">${r.status==='accepted'?button('Record collection','collect',`data-id="${r.id}"`,'primary','check'):''}${active?button('Cancel request','cancel-recovery',`data-id="${r.id}"`,'secondary'):''}</div>${active?`<details class="simulation-panel" open><summary>${icon('settings')} Partner response <span class="sim-label">Simulated</span></summary><form data-form="recovery-response">${selectField(o,'kind','Response',[{value:'accepted',label:r.status==='exception'?'Resolve and accept request':'Accept request'},{value:'exception',label:'Report exception / delay'}],'accepted')}${noteField(o,'note','Response / follow-up',r.followUp||'Partner response recorded',true)}<button type="submit" class="btn secondary">Apply simulated response</button></form></details>`:''}<h3 class="section-heading">Request timeline</h3>${timeline(r.events)}`};}
function renderOverlay(s,o,error='',discard=false){if(!o)return'';let content;if(o.type==='ingredient')content=ingredientOverlay(s,o);else if(o.type==='record')content=recordOverlay(s,o);else if(o.type==='draft')content=draftOverlay(s,o);else if(o.type==='approval')content=approvalOverlay(s,o);else if(o.type==='order')content=orderOverlay(s,o);else if(o.type==='new-recovery')content=recoveryForm(s,o);else if(o.type==='recovery')content=recoveryOverlay(s,o);else if(o.type==='reset')content={title:'Reset the demo?',sub:'Return to the original restaurant dataset',center:true,body:`<div class="confirmation-icon">${icon('refresh')}</div><p class="confirmation-intro">This clears your PANTRI demo changes and restores the original 132 ingredients, three drafts and demonstration date.</p><p class="field-help">Download your data first if you want to keep this run. Other browser data is unaffected.</p><div class="form-footer">${button('Keep my data','close-overlay','','secondary')}${button('Reset demo','confirm-reset','','primary','refresh')}</div>`};else content={title:'Demo tools',sub:'A repeatable presentation workspace',center:true,body:`<div class="notice compact">${icon('info')}<span>All records are synthetic. The demo date is fixed at October 21, 2026.</span></div><div class="tool-row"><div><strong>Export your demonstration</strong><p>Download records, approved snapshots and event history.</p></div>${button('Download JSON','export','','secondary','download')}</div><div class="tool-row"><div><strong>Restart the presentation</strong><p>Restore the same starting data for the next run.</p></div>${button('Reset demo','reset','','secondary','refresh')}</div><div class="tool-row"><div><strong>External responses</strong><p>Open a sent purchase order or recovery request to apply an explicitly simulated partner event.</p></div></div>`};return`<div class="overlay-backdrop" data-action="backdrop"><section class="${content.center?'modal':'drawer'}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header class="dialog-header"><div><h2 id="dialog-title">${esc(content.title)}</h2><p>${esc(content.sub)}</p></div>${button(icon('close'),'close-overlay','aria-label="Close dialog"','icon-button')}</header><div class="dialog-body">${error?`<div class="form-error" role="alert">${icon('alert')} ${esc(error)}</div>`:''}${discard?`<div class="discard-warning" role="alert"><strong>Discard your unsaved changes?</strong><div>${button('Keep editing','keep-editing','','secondary')}${button('Discard changes','discard','','danger')}</div></div>`:''}${content.body}</div></section></div>`;}


const root=document.getElementById('app');
const service=createDemoService({getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)});
const ui={page:'overview',lastPage:null,pageNumber:1,pageSize:12,filter:{},purchaseTab:'drafts',wasteTab:'waste',reportPeriod:'week',overlay:null,error:'',dirty:false,discard:false,notice:null,animateCharts:false,chartsPlayed:false,lastRevision:service.getSnapshot().revision,highlight:false};
let toastTimer,focusBack=null;
try{ui.chartsPlayed=sessionStorage.getItem('pantri.charts.played')==='1'}catch{}
const operation=()=>crypto.randomUUID?.()??`op-${Date.now()}-${Math.random()}`;
function toast(message,error=false){ui.notice={message,error};renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.notice=null;renderToast()},3000);}
function renderToast(){const el=document.getElementById('toast-region');if(el)el.innerHTML=ui.notice?`<div class="toast ${ui.notice.error?'error':''}" role="${ui.notice.error?'alert':'status'}">${icon(ui.notice.error?'alert':'check')}<span>${esc(ui.notice.message)}</span></div>`:'';}
function snapshotForm(){const form=root.querySelector('[role="dialog"] form');if(form&&ui.overlay)ui.overlay.values=captureInputs(form.elements);}
function render(){if(ui.dirty)snapshotForm();const hint=focusHint(document.activeElement);const s=service.getSnapshot(),active=document.activeElement,focusId=active?.id,selection=active?.selectionStart;const pageChanged=ui.page!==ui.lastPage;ui.animateCharts=ui.page==='overview'&&!ui.chartsPlayed;ui.highlight=s.revision!==ui.lastRevision;const pages={overview:renderOverview,inventory:renderInventory,purchasing:renderPurchasing,waste:renderWaste,reports:renderReports};const nav=[['overview','home','Overview'],['inventory','box','Inventory'],['purchasing','cart','Purchasing'],['waste','leaf','Waste & recovery'],['reports','chart','Reports']];const draftCount=s.drafts.filter(d=>d.status==='draft').length;const problem=service.getProblem();root.innerHTML=`<div class="app-shell"><aside class="sidebar"><a class="brand" href="#overview" data-action="overview" aria-label="PANTRI overview"><span class="brand-leaf"></span>PANTRI<span class="brand-period">.</span></a><div class="nav-label">WORKSPACE</div><nav aria-label="Main navigation">${nav.map(([page,ico,label])=>`<button type="button" class="nav-item ${ui.page===page?'active':''}" data-action="${page}" ${ui.page===page?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${page==='purchasing'&&draftCount?`<span class="nav-count">${draftCount}</span>`:''}</button>`).join('')}</nav></aside><div class="workspace"><header class="topbar"><div class="restaurant-name">${icon('leaf')}<strong>Demo Buffet Hot Pot</strong><span class="breadcrumb">/ Operations</span></div><div class="topbar-right"><span class="demo-tag"><i></i>DEMO DATA</span>${button('Demo tools','demo','','toolbar-button','settings')}<span class="avatar" aria-label="Manager MC">MC</span></div></header>${problem?`<div class="storage-banner" role="alert"><div>${icon('alert')}<span>${esc(problem)}</span></div><div>${button('Download saved copy','export-raw','','mini')}${button('Reload saved data','reload','','mini')}${button('Reset','reset','','mini')}</div></div>`:''}<main id="main-content" class="page ${pageChanged?'page-enter':''}">${pages[ui.page](s,ui)}</main></div></div>${renderOverlay(s,ui.overlay,ui.error,ui.discard)}<div id="toast-region" aria-live="polite" aria-atomic="true"></div>`;
ui.lastPage=ui.page;ui.lastRevision=s.revision;if(ui.animateCharts){ui.chartsPlayed=true;try{sessionStorage.setItem('pantri.charts.played','1')}catch{}}document.body.classList.toggle('dialog-open',!!ui.overlay);renderToast();if(ui.overlay){const target=chooseFocusTarget(dialogControls(root.querySelector('[role=dialog]')),hint);if(target){target.focus({preventScroll:true});if(typeof selection==='number'&&['text','search'].includes(target.type))target.setSelectionRange(selection,selection);}}else if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});if(typeof selection==='number'&&['text','search'].includes(el.type))el.setSelectionRange(selection,selection);}}}
function focusDialog(){requestAnimationFrame(()=>{const d=root.querySelector('[role="dialog"]');(d?.querySelector('input:not([type="hidden"]), select, textarea')??d?.querySelector('button')??d)?.focus({preventScroll:true});});}
function openOverlay(overlay,back=null){focusBack=document.activeElement?.dataset?{action:document.activeElement.dataset.action,id:document.activeElement.dataset.id}:null;ui.overlay={...overlay,operationId:operation(),returnFocus:focusBack,back};ui.error='';ui.dirty=false;ui.discard=false;render();focusDialog();}
function closeOverlay(force=false){if(ui.dirty&&!force){snapshotForm();ui.discard=true;render();requestAnimationFrame(()=>root.querySelector('[data-action="keep-editing"]')?.focus());return;}const back=ui.overlay?.back;if(back)focusBack=back.returnFocus??focusBack;ui.overlay=back??null;ui.error='';ui.dirty=false;ui.discard=false;render();if(back)focusDialog();else requestAnimationFrame(()=>{let target;if(focusBack?.action)target=[...root.querySelectorAll('[data-action]')].find(el=>el.dataset.action===focusBack.action&&(!focusBack.id||el.dataset.id===focusBack.id));(target??root.querySelector('.nav-item.active'))?.focus({preventScroll:true});});}
function navigate(page,filter){ui.page=page;ui.overlay=null;ui.error='';ui.dirty=false;ui.discard=false;if(page==='inventory'){ui.filter=filter??{};ui.pageNumber=1;}render();window.scrollTo({top:0,behavior:'instant'});}
function commit(work,message){const result=service.commit(work);if(!result.ok){snapshotForm();ui.error=result.message;if(ui.overlay)render();else toast(result.message,true);return null;}ui.dirty=false;ui.error='';if(ui.overlay)ui.overlay.values=undefined;render();if(message)toast(message);return result.value;}
function download(text,name,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id;if(action==='backdrop'){if(e.target===el)closeOverlay();return;}e.preventDefault();const s=service.getSnapshot();if(['overview','inventory','purchasing','waste','reports'].includes(action)){navigate(action);return;}if(action==='filter'){navigate('inventory',{risk:el.dataset.risk});return;}if(action==='category'){navigate('inventory',{category:el.dataset.category});return;}if(action==='orders'){ui.purchaseTab='orders';navigate('purchasing');return;}if(action==='clear-filters'){ui.filter={};ui.pageNumber=1;render();return;}if(action==='prev'||action==='next'){ui.pageNumber+=action==='next'?1:-1;render();return;}if(action==='purchase-tab'){ui.purchaseTab=el.dataset.tab;render();return;}if(action==='waste-tab'){ui.wasteTab=el.dataset.tab;render();return;}if(action==='ingredient'){openOverlay({type:'ingredient',id});return;}if(action==='record'){openOverlay({type:'record',kind:el.dataset.kind,ingredientId:el.dataset.ingredient??'ing-001'},ui.overlay?.type==='ingredient'?ui.overlay:null);return;}if(action==='draft'){openOverlay({type:'draft',id});return;}if(action==='order'){openOverlay({type:'order',id});return;}if(action==='recovery'){openOverlay({type:'recovery',id});return;}if(action==='new-recovery'){openOverlay({type:'new-recovery'});return;}if(action==='close-overlay'){closeOverlay();return;}if(action==='keep-editing'){ui.discard=false;render();focusDialog();return;}if(action==='discard'){closeOverlay(true);return;}if(action==='review-approval'){if(ui.dirty){ui.error='Save your quantity changes before reviewing approval.';snapshotForm();render();return;}openOverlay({type:'approval',id});return;}if(action==='back-draft'){openOverlay({type:'draft',id});return;}if(action==='approve-send'){const approved=commit(x=>approveDraft(x,id,Number(el.dataset.version),ui.overlay.operationId));if(approved){const order=approved.orders.find(o=>o.sourceDraftId===id);const sent=commit(x=>sendApprovedOrder(x,order.id,`send-${order.id}`));ui.purchaseTab='orders';ui.page='purchasing';openOverlay({type:'order',id:order.id});toast(sent?'Purchase approved and sent to simulated supplier.':'Order approved. Sending needs to be retried.',!sent);}return;}if(action==='send-order'){if(commit(x=>sendApprovedOrder(x,id,`send-${id}`),'Approved order sent to simulated supplier.'))render();return;}if(action==='receive-order'){const x=s.orders.find(o=>o.id===id),line=x.approvedLines.find(l=>l.managerQty>(x.receivedQuantities[l.ingredientId]??0));if(line)openOverlay({type:'record',kind:'receipt',ingredientId:line.ingredientId,orderId:id},ui.overlay);return;}if(action==='new-draft-from-order'){const next=commit(x=>createDraftFromOrder(x,id,ui.overlay.operationId+'-followup'));if(next){ui.page='purchasing';ui.purchaseTab='drafts';openOverlay({type:'draft',id:next.drafts.at(-1).id});toast('New draft created from current inventory. The approved order is unchanged.');}return;}if(action==='refresh-draft'){if(ui.dirty){ui.error='Save or discard quantity changes before recalculating.';snapshotForm();render();return;}const d=s.drafts.find(d=>d.id===id);commit(x=>refreshDraft(x,id,d.version),'Recommendation refreshed from current inventory.');return;}if(action==='refresh-drafts'){let latest=s;for(const d of s.drafts.filter(d=>d.status==='draft')){const next=commit(x=>refreshDraft(x,d.id,d.version));if(!next)return;latest=next;}toast('Draft recommendations refreshed from current inventory.');return;}if(action==='collect'){if(commit(x=>recordCollection(x,id,`collect-${id}`),'Collection recorded. Inventory updated once.'))render();return;}if(action==='cancel-recovery'){if(commit(x=>cancelRecovery(x,id,`cancel-${id}`),'Request cancelled and reservation released.'))render();return;}if(action==='confirm-cancel'){if(commit(x=>cancelRecovery(x,id,`cancel-${id}`),'Request cancelled and reservation released.')){openOverlay({type:'recovery',id});}return;}if(action==='demo'){openOverlay({type:'demo'});return;}if(action==='reset'){openOverlay({type:'reset'});return;}if(action==='confirm-reset'){const result=service.resetDemo();if(result.ok){ui.page='overview';ui.overlay=null;ui.filter={};ui.purchaseTab='drafts';ui.wasteTab='waste';ui.chartsPlayed=false;ui.error='';ui.dirty=false;render();toast('Demo reset to the original restaurant dataset.');}else{ui.error=result.message;render();}return;}if(action==='export'){download(exportDemoState(s),`PANTRI_demo_${s.demoDate}.json`);toast('Demo data exported with records and approval snapshots.');return;}if(action==='export-raw'){download(service.getRaw()??'No saved data','PANTRI_saved_recovery.txt','text/plain');return;}if(action==='reload'){if(ui.dirty&&!window.confirm('Reload the latest saved data and discard your unsaved form changes?'))return;ui.overlay=null;ui.dirty=false;ui.error='';ui.discard=false;if(service.reload())toast('Latest saved data loaded.');return;}});
root.addEventListener('input',e=>{if(e.target.id==='inventory-search'){ui.filter.query=e.target.value;ui.pageNumber=1;render();}else if(e.target.closest('[role="dialog"] form'))ui.dirty=true;});
root.addEventListener('change',e=>{const id=e.target.id;if(id==='category-filter'){ui.filter.category=e.target.value;ui.pageNumber=1;render();}else if(id==='risk-filter'){ui.filter.risk=e.target.value;ui.pageNumber=1;render();}else if(id==='page-size'){ui.pageSize=Number(e.target.value);ui.pageNumber=1;render();}else if(id==='report-period'){ui.reportPeriod=e.target.value;render();}else if(e.target.name==='ingredientId'&&ui.overlay){snapshotForm();const values=ui.overlay.values;ui.overlay.ingredientId=values.ingredientId;delete values.batchId;delete values.quantity;delete values.countedQuantity;delete values.unitCost;delete values.expiresOn;ui.dirty=true;render();}else if(e.target.name==='batchId'&&ui.overlay?.type==='record'&&ui.overlay.kind==='count'){snapshotForm();delete ui.overlay.values.countedQuantity;render();}});
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;if(!kind)return;const values=Object.fromEntries(new FormData(form)),s=service.getSnapshot(),o=ui.overlay;try{if(kind==='inventory-record'){const i=s.ingredients.find(i=>i.id===values.ingredientId);const command={kind:o.kind,operationId:o.operationId,ingredientId:i.id,batchId:values.batchId,unit:i.unit,quantity:Number(values.quantity),countedQuantity:Number(values.countedQuantity),expiresOn:values.expiresOn||null,unitCostCents:Math.round(Number(values.unitCost)*100),orderId:o.orderId,reason:values.reason+(values.note?`: ${values.note}`:'')};if(commit(x=>applyInventoryCommand(x,command),'Inventory record saved.'))closeOverlay(true);}else if(kind==='draft'){const d=s.drafts.find(d=>d.id===o.id);commit(x=>editDraft(x,o.id,Number(values.version),d.lines.map(l=>({ingredientId:l.ingredientId,managerQty:Number(values['qty_'+l.ingredientId])}))),'Draft saved. Approval is still required.');}else if(kind==='supplier'){commit(x=>recordSupplierEvent(x,{id:o.operationId+'-'+operation(),restaurantId:s.restaurantId,transactionId:o.id,kind:values.kind,occurredAt:eventTime(s),note:values.note}),'Simulated supplier response recorded. Stock is unchanged.');}else if(kind==='recovery-request'){if(commit(x=>requestRecovery(x,{...values,quantity:Number(values.quantity)},o.operationId),'Recovery requested. Quantity is reserved.')){const id=service.getSnapshot().recoveries.at(-1).id;ui.wasteTab='recovery';ui.page='waste';openOverlay({type:'recovery',id});}}else if(kind==='recovery-response'){commit(x=>recordRecoveryEvent(x,{id:o.operationId+'-'+operation(),restaurantId:s.restaurantId,transactionId:o.id,kind:values.kind,occurredAt:eventTime(s),note:values.note}),'Simulated partner response recorded. Collection remains separate.');}}catch(error){snapshotForm();ui.error=error.message;render();}});
document.addEventListener('keydown',e=>{if(!ui.overlay)return;if(e.key==='Escape'){e.preventDefault();closeOverlay();return;}if(e.key==='Tab'){const target=tabBoundaryTarget(dialogControls(root.querySelector('[role="dialog"]')),document.activeElement,e.shiftKey);if(target){e.preventDefault();target.focus();}}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)service.markExternalChange();});
service.subscribe(()=>render());render();
</script></body></html>
