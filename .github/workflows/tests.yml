name: PMC2 requirement evidence
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/build_pmc2.py --check
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: node tools/pmc2_scenario.js > pmc2-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: pmc2-prepared-run
          path: |
            pmc2-run.json
            PANTRI_PMC2.html
