:root {
  --green: #25d366;
  --brand: #168447;
  --green-text: #126d36;
  --ink: #182b20;
  --muted: #55675c;
  --line: #dfe8e1;
  --soft: #f5faf6;
  --orange: #bb6c0d;
  --red: #b84337;
  --risk-healthy: #25d366;
  --risk-expiring: #efa52a;
  --risk-low: #db674d;
  --risk-expired: #a73332;
  --risk-unknown: #9ca9a0;
}

html { scrollbar-gutter: stable; }
.app-shell {
  grid-template-columns: 187px minmax(0, 1fr);
  max-width: 1320px;
  width: calc(100% - 16px);
  min-height: calc(100vh - 16px);
  margin: 8px auto;
  border: 1px solid var(--line);
  border-radius: 15px;
}

.sidebar { padding-top: 4px; border-radius: 15px 0 0 15px; height: calc(100vh - 16px); }
.workspace { border-radius: 0 15px 15px 0; }

.sidebar .brand {
  gap: 9px;
  padding: 0;
  height: 53px;
  margin: 15px 23px 45px;
  color: var(--ink);
  font-size: 29px;
  letter-spacing: -1.65px;
}

.brand-leaf { flex-shrink: 0; margin-right: 0; background: var(--green); }
.brand-period { color: var(--brand); margin-left: -8px; }
.sidebar nav { padding-inline: 12px; }

.nav-item {
  min-height: 44px;
  border-radius: 8px;
  color: var(--muted);
  padding-inline: 11px;
  gap: 9px;
  white-space: nowrap;
  font-size: 13px;
  transition: background-color 160ms, color 160ms, transform 160ms;
}

.nav-item:hover:not(.active) {
  box-shadow: inset 3px 0 var(--green);
  color: var(--green-text);
  transform: translateX(2px);
}

.nav-item.active {
  background: var(--green);
  border-radius: 8px;
  color: #092c16;
  box-shadow: none;
}

.nav-count { background: #dff4e6; color: #175a32; }
.topbar { padding-inline: clamp(22px, 3vw, 45px); min-height: 68px; }
.restaurant-name { gap: 10px; }
.restaurant-name > .icon { box-sizing: content-box; width: 15px; height: 15px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--green-text); }
.restaurant-name strong { color: var(--ink); font-size: 14px; }
.demo-tag { background: transparent; color: #345c41; font-size: 11px; letter-spacing: .065em; }
.avatar { background: #e8f5ec; color: #1b5a33; }

.page {
  max-width: 1520px;
  margin-inline: auto;
  padding: 31px clamp(22px, 3vw, 45px) 46px;
}

.page-heading {
  align-items: flex-end;
  gap: 18px;
  margin-bottom: 26px;
}

.page-heading h1 {
  color: var(--ink);
  font-size: clamp(31px, 3.6vw, 48px);
  font-weight: 760;
  letter-spacing: -.05em;
  line-height: 1.05;
  margin: 0 0 9px;
}

.overview-hero { align-items: center; margin-bottom: 26px; }
.overview-hero h1 { font-size: clamp(31px, 3.35vw, 43px); }
.overview-hero h1 span { color: var(--green-text); }

@keyframes toast-drop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.dialog-refresh, .overlay-backdrop:has(.dialog-refresh) { animation: none; }
.dialog-header, .dialog-body { padding-inline: 23px; }
.dialog-header h2 { color: var(--ink); }
.dialog-header p, .field-help, .drawer-summary small, .drawer-summary em,
.summary-strip span, .batch-card p, .form-intro p, .movement p, .movement small { color: var(--muted); }
.drawer-actions .btn { font-size: 12px; }
.field > span { font-size: 13px; color: var(--ink); }
.field input, .field select, .field textarea { font-size: 14px; border-color: #cdded2; }

.form-error { border-color: #e7b2ac; color: #852b22; }
.toast { max-width: min(460px, calc(100vw - 26px)); font-size: 13px; }

/* Shared interaction language for Inventory, Purchasing, Waste & recovery and Reports */
.btn .icon:is([data-icon="arrow"], [data-icon="chevron"], [data-icon="plus"], [data-icon="refresh"], [data-icon="download"], [data-icon="send"]) {
  transition: transform 220ms cubic-bezier(.2, .7, .2, 1);
}

.btn:is(:hover, :focus-visible) .icon[data-icon="arrow"] { transform: translateX(3px); }
.btn:is(:hover, :focus-visible) .icon[data-icon="chevron"] { transform: translateX(2px); }
.btn:is(:hover, :focus-visible) .icon[data-icon="plus"] { transform: rotate(90deg); }
.btn:is(:hover, :focus-visible) .icon[data-icon="refresh"] { transform: rotate(-180deg); }
.btn:is(:hover, :focus-visible) .icon[data-icon="download"] { transform: translateY(2px); }
.btn:is(:hover, :focus-visible) .icon[data-icon="send"] { transform: translate(2px, -2px); }
.btn.secondary { transition: background-color 160ms, border-color 160ms, color 160ms, transform 160ms; }
.btn.secondary:hover { border-color: #9bd5af; color: var(--green-text); }

.draft-card, .recovery-card, .planning-signal {
  transition: transform 220ms cubic-bezier(.2, .7, .2, 1), box-shadow 220ms, border-color 220ms;
}

.draft-card:is(:hover, :focus-within), .recovery-card:is(:hover, :focus-within), .planning-signal:is(:hover, :focus-within) {
  transform: translateY(-2px);
  border-color: #bfe3cb;
  box-shadow: 0 8px 22px #1437200f;
}

.draft-calculation .suggested b { transition: color 200ms; }
.draft-card:hover .draft-calculation .suggested b { color: #0f8a3f; }
.planning-signal h3 { transition: color 200ms; }
.planning-signal:hover h3, .recovery-card:hover .card-head h2 { color: var(--green-text); }

tbody tr { transition: background-color 160ms; }
.item-icon { transition: background-color 200ms, border-color 200ms, color 200ms; }
.table-card tr:is(:hover, :focus-within) .item-icon { background: #effaf2; border-color: #bfe3cb; color: var(--green-text); }
.table-card .btn.icon-button { border-radius: 50%; transition: background-color 220ms, color 220ms; }
.table-card tr:is(:hover, :focus-within) .btn.icon-button { background: var(--green); color: var(--ink); }
.table-card tr:is(:hover, :focus-within) .btn.mini { border-color: var(--green); background: #effaf2; }

.segment-control button { transition: background-color 200ms, color 200ms, box-shadow 200ms, transform 160ms; }
.segment-control button:active { transform: scale(.97); }
.segment-control button[aria-pressed="true"] { box-shadow: 0 2px 7px #1437201a; }

.inventory-toolbar > select, .period-control > select, .pagination select { transition: border-color 160ms; }
.inventory-toolbar > select:hover, .period-control > select:hover, .pagination select:hover { border-color: #9bd5af; }
.search-field:hover { border-color: #9bd5af; }
.search-field:focus-within { border-color: var(--green-text); box-shadow: 0 0 0 3px #25d36624; }
.search-field:focus-within .icon { color: var(--green-text); }

@media (max-width: 1050px) {
  .nav-item { gap: 6px; padding-inline: 9px; font-size: 12px; }
  .app-shell { grid-template-columns: 169px minmax(0, 1fr); }

  .sidebar { height: auto; }
  .sidebar nav { gap: 5px; padding: 0 11px 8px; }
  .sidebar .brand { margin: 12px 16px 9px; font-size: 26px; }
  .nav-item { flex: 0 0 auto; min-height: 36px; font-size: 12px; padding-inline: 8px; }
  .nav-item.active { box-shadow: none; }
  .topbar { min-height: 55px; padding-inline: 13px; gap: 7px; }
  .topbar .avatar { display: none; }
  .topbar-right { gap: 5px; }
  .toolbar-button { min-height: 32px; font-size: 11px; padding: 5px 7px; }
  .demo-tag { padding: 5px; font-size: 10px; white-space: nowrap; }
  .restaurant-name strong { font-size: 12px; }

  .page { padding: 21px 13px 27px; }

  .heading-actions { justify-content: flex-start; gap: 8px; }
  .metric, .overview-metrics .metric, .overview-metrics .metric:first-child { padding: 11px 9px; min-height: 105px; }
  .metric-label, .metric-foot { font-size: 11px; }
  .metric-value { font-size: 26px; margin: 8px 0 4px; }
  .summary-metrics .metric-value, .report-metrics .metric-value { font-size: 23px; }
  .overview-grid { gap: 13px; }
  .card-head { gap: 8px; padding: 14px 12px 10px; }
  .card-body { padding: 0 12px 13px; }
  .card-head h2 { font-size: 15px; }
  .card-head p { font-size: 11px; }
  .card-head > .btn { flex: 0 0 auto; font-size: 11px; }
  .chart-heading { align-items: flex-start; flex-wrap: wrap; }
  .health-layout { gap: 10px; grid-template-columns: 110px minmax(0, 1fr); }
  .health-legend button { gap: 5px; font-size: 12px; }
  .plot-columns { gap: 4px; }
  .paired-chart { height: 162px; gap: 4px; }
  .cost-value small { display: none; }
  .paired-chart .chart-axis { width: 31px; font-size: 10px; }
  .cost-date { font-size: 9px; }
  .trend-details { padding-inline: 12px; }
  .category-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .category-tiles button { font-size: 11px; padding-inline: 7px; gap: 6px; }
  .activity-list { padding-inline: 9px; }
  .activity-link { grid-template-columns: 7px minmax(0, 1fr) 75px 12px; gap: 6px; }
  .activity-link time { white-space: normal; }
  .inventory-toolbar > select { flex: 1 1 115px; }

  .table-meta > span:last-child { display: inline; }

@media (prefers-reduced-motion: reduce) {
  .nav-item:hover:not(.active), .btn.primary:hover, .inline-arrow:hover .icon, .task-row:is(:hover, :focus-visible) .task-arrow,
  .cost-day:is(:hover, :focus-visible, [aria-pressed="true"]), .health-legend button:hover,
  .btn:is(:hover, :focus-visible) .icon, .segment-control button:active,
  .draft-card:is(:hover, :focus-within), .recovery-card:is(:hover, :focus-within), .planning-signal:is(:hover, :focus-within) { transform: none; }
  .cost-day:is(:hover, :focus-visible, [aria-pressed="true"]) .cost-value { transform: translate(-50%, 0); }
  .overlay-backdrop { backdrop-filter: none; }
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ==========================================================================
   PANTRI glass skin (loaded last; overrides base.css and presentation.css)
   Glass = translucent fill + backdrop blur/saturate + white hairline + rim light.
   Rule of thumb: an element that carries backdrop-filter / filter / opacity < 1 becomes the
   "backdrop root" for everything inside it, so containers (workspace, overlay) never carry a
   backdrop-filter themselves — only the leaf surfaces (cards, drawers, pickers) do.
   ========================================================================== */
:root {
  --skin-ink: #13291c;
  --skin-muted: #3d5747;
  --skin-hero-top: #12833f;
  --skin-hero-bottom: #0b5a2c;
  --skin-glass: linear-gradient(150deg, rgba(255, 255, 255, .74) 0%, rgba(255, 255, 255, .48) 100%);
  --skin-glass-solid: rgba(255, 255, 255, .86);
  --skin-glass-strong: rgba(250, 254, 251, .82);
  --skin-glass-line: rgba(255, 255, 255, .7);
  --skin-shadow: 0 12px 32px -10px rgba(12, 60, 32, .22), 0 2px 6px rgba(12, 60, 32, .06);
  --skin-rim: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .35);
  --skin-sidebar: linear-gradient(165deg, rgba(20, 78, 48, .76) 0%, rgba(9, 46, 28, .82) 100%);
  --skin-dark-pill: #13291c;
  --skin-field-line: rgba(19, 41, 28, .18);
  --skin-backdrop:
    radial-gradient(55% 50% at 10% 15%, #9fdcb3 0%, transparent 70%),
    radial-gradient(40% 40% at 90% 6%, #f1f6df 0%, transparent 70%),
    radial-gradient(50% 55% at 82% 88%, #57a876 0%, transparent 70%),
    radial-gradient(38% 42% at 28% 92%, #e5efc8 0%, transparent 70%),
    linear-gradient(135deg, #cfe9d6 0%, #93c9a5 50%, #eef4e4 100%);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
  --rail: 76px;
  --rail-open: 236px;
  --ink: var(--skin-ink);
  --muted: var(--skin-muted);
  --line: rgba(19, 41, 28, .1);
}

/* ---------- Backdrop ---------- */
body { background: var(--skin-backdrop); background-attachment: fixed; color: var(--skin-ink); }
body::before, body::after {
  content: ""; position: fixed; z-index: -1; border-radius: 50%;
  filter: blur(40px); pointer-events: none;
}
body::before { width: 46vw; height: 46vw; left: 38vw; top: -12vw; opacity: .75; background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0) 65%); }
body::after { width: 40vw; height: 40vw; left: -8vw; bottom: -14vw; opacity: .45; background: radial-gradient(circle, #17a34a 0%, rgba(0, 0, 0, 0) 65%); }

/* ---------- Shell: icon rail + floating workspace ---------- */
/* The grid column itself animates, so when the rail opens the workspace is pushed aside and
   narrows smoothly rather than being covered. */
.app-shell {
  position: relative; z-index: 0;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: 14px; padding: 14px;
  width: 100%; max-width: 1440px; min-height: 100vh;
  margin: 0 auto; border: 0; background: transparent;
  transition: grid-template-columns 380ms var(--ease-out);
}
/* "rail-open" is kept by shell.js (pointer inside the rail, with a short intent delay) and
   survives re-renders, so clicking a page keeps the rail open until the pointer leaves it. */
.app-shell.rail-open, .app-shell:has(.sidebar :focus-visible) {
  grid-template-columns: var(--rail-open) minmax(0, 1fr);
}
.workspace {
  position: relative; isolation: isolate; overflow: hidden;
  border: 1px solid var(--skin-glass-line); border-radius: 26px;
  background: linear-gradient(150deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, .14));
  box-shadow: var(--skin-shadow), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.workspace::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(32% 28% at 78% 38%, rgba(37, 211, 102, .28), transparent 70%),
    radial-gradient(30% 26% at 22% 62%, rgba(232, 246, 190, .75), transparent 70%),
    radial-gradient(26% 22% at 55% 8%, rgba(255, 255, 255, .8), transparent 70%);
}
.topbar { border-bottom: 0; background: transparent; }
.restaurant-name > .icon { border-radius: 50%; border-color: var(--skin-glass-line); background: var(--skin-glass-strong); color: var(--skin-hero-top); }
.demo-tag { color: var(--skin-muted); }
.demo-tag i { background: var(--skin-hero-top); }
.avatar { background: var(--skin-glass-strong); color: var(--skin-ink); }

/* Sidebar: a 76px icon rail that fills its grid column; hovering (or keyboard focus) opens the
   column, the page slides over, labels follow out of a blur, the white pill stretches with it. */
.sidebar {
  position: sticky; top: 14px; z-index: 30;
  width: 100%; height: calc(100vh - 28px);
  padding-top: 4px; overflow: hidden;
  border: 1px solid var(--skin-glass-line); border-radius: 26px;
  background: var(--skin-sidebar); color: #fff;
  backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
  box-shadow: 0 20px 40px -16px rgba(6, 40, 22, .45), inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.sidebar .brand { height: 53px; margin: 15px 0 45px 26px; padding: 0; gap: 9px; color: #fff; font-size: 29px; letter-spacing: -1.65px; white-space: nowrap; }
.sidebar .brand-period { color: #fff; margin-left: 0; }
.brand-leaf { flex-shrink: 0; margin-right: 0; background: #fff; }
.brand-word, .nav-text {
  opacity: 0; filter: blur(6px); transform: translateX(-6px);
  transition: opacity 160ms ease, filter 160ms ease, transform 160ms ease;
}
.app-shell.rail-open .sidebar :is(.brand-word, .nav-text), .sidebar:has(:focus-visible) :is(.brand-word, .nav-text) {
  opacity: 1; filter: blur(0); transform: none;
  transition: opacity 260ms ease, filter 260ms ease, transform 260ms var(--ease-out);
  transition-delay: calc(230ms + var(--n, 0) * 28ms);
}
.sidebar nav { position: relative; padding: 0 12px; }
.nav-item {
  position: relative; z-index: 1;
  min-height: 44px; padding-inline: 17px; gap: 14px;
  border-radius: 14px; background: transparent; box-shadow: none;
  color: rgba(255, 255, 255, .82); font-size: 13.5px; font-weight: 600; white-space: nowrap;
  transition: background-color 160ms;
}
.nav-item .icon { width: 18px; height: 18px; color: inherit; }
.nav-item:hover:not(.active) { background: rgba(255, 255, 255, .1); color: #fff; box-shadow: none; transform: none; }
.nav-item.active { background: transparent; color: rgba(255, 255, 255, .82); box-shadow: none; }
.nav-count {
  position: absolute; left: 31px; top: 5px;
  min-width: 17px; height: 17px; padding: 0 5px; margin: 0;
  display: inline-grid; place-items: center; border-radius: 999px;
  background: #fff; color: var(--skin-ink); font-size: 10.5px; font-weight: 750;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
}
/* The pill lies over the items; inside it an ink-coloured copy of the menu moves the opposite
   way, so dark text shows exactly where the white pill is and white text everywhere else. */
.nav-pill {
  position: absolute; left: 12px; right: 12px; top: 0; z-index: 2;
  overflow: hidden; border-radius: 14px; background: #fff;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .18);
  pointer-events: none;
  transition: transform 340ms var(--ease-spring);
}
.nav-pill-ink {
  position: absolute; top: 0; left: -12px; right: -12px; padding: 0 12px;
  transition: transform 340ms var(--ease-spring);
}
.nav-pill-ink .nav-item { color: var(--skin-ink); }
.nav-pill-ink .nav-item .icon { color: var(--skin-hero-top); }
.nav-pill-ink .nav-count { background: var(--skin-ink); color: #fff; box-shadow: none; }
.sidebar :focus-visible { outline-color: #fff !important; }

/* ---------- Typography on glass ---------- */
.page-heading h1 { color: var(--skin-ink); }
.overview-hero h1 span { color: var(--skin-hero-top); font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; letter-spacing: -.02em; }
.eyebrow, .page-heading p { color: var(--skin-muted); }
.table-meta, .list-tools > div > span, .period-control > span { font-size: 12.5px; color: var(--skin-muted); }
.table-meta b { color: var(--skin-ink); }
.field-help, .activity-row time small, .batch-card p, .draft-body > p, .draft-calculation em,
.draft-calculation small, .draft-bottom small, .empty-state, .empty-state p, .recovery-card .card-body > p,
.tool-row p, .summary-strip > span, .section-heading > span, .drawer-summary small, .drawer-summary em,
.math-list > div, .approved-lines > div, .confirmation-intro, .approval-callout p, .movement p, .movement small,
.simulation-panel summary, .activity-link p, .activity-link small, .health-footer, .card-head p {
  color: var(--skin-muted);
}
.field-help, .activity-row time small, .batch-card p, .draft-body > p, .tool-row p, .summary-strip > span,
.section-heading > span, .drawer-summary small, .simulation-panel summary, .approval-callout p { font-size: 12px; }
.draft-calculation > span { color: var(--skin-muted); }
.draft-calculation b, .draft-bottom b, .math-list b, .approved-lines b, .summary-strip b, .section-heading,
.empty-state h3, .tool-row strong, .approval-callout strong, .drawer-summary b { color: var(--skin-ink); }
.tool-row strong { font-size: 13px; }

/* ---------- Glass surfaces ---------- */
.card, .table-card, .metric, .notice, .batch-card, .live-preview, .planning-signal, .planning-context, .report-range {
  background: var(--skin-glass);
  border: 1px solid rgba(255, 255, 255, .7);
  border-radius: 22px;
  box-shadow: var(--skin-shadow), var(--skin-rim);
  backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
}
.metric.interactive, .card { transition: transform .18s ease, box-shadow .18s ease, background-color .2s, border-color .2s, color .2s; }
.metric.interactive:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -12px rgba(12, 60, 32, .28), var(--skin-rim); }
.metric { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.card-footer, .health-footer, .trend-footer { border-top-color: rgba(19, 41, 28, .08); }
.health-legend button, .category-tiles button, .value-row, .activity-link, .task-row, .ingredient-button, .cost-day { background: transparent; }
.health-legend button, .task-row, .batch-card, .value-row, .activity-link { border-radius: 14px; }
.health-legend button[aria-pressed="true"], .health-legend button:hover,
.activity-link:hover, .value-row:hover { background: var(--skin-glass-solid); border-color: rgba(255, 255, 255, .8); }
.draft-supplier { background: rgba(255, 255, 255, .3); border-bottom-color: rgba(19, 41, 28, .08); color: var(--skin-muted); }
.health-track { stroke: rgba(255, 255, 255, .55); }
.category-track { background: rgba(255, 255, 255, .45); }
.category-track i { background: var(--skin-hero-top); }
.filter-pill { border: 0; border-radius: 999px; padding: 3px 10px; background: rgba(37, 211, 102, .16); color: #126d36; font-size: 11.5px; font-weight: 650; }

/* KPI tiles: icon in a white round base above the label, on every page */
.overview-metrics { gap: 14px; border: 0; padding: 0; }
/* presentation.css turns these four into flat white cells (border 0, radius 0, white, divider on
   the right); every one of those selectors is matched here so they are glass like the other cards */
.overview-metrics .metric, .overview-metrics .metric:hover, .overview-metrics .metric:first-child, .overview-metrics .metric:last-child {
  min-height: 0; padding: 18px 20px 16px;
  border: 1px solid rgba(255, 255, 255, .7); border-radius: 22px;
  background: var(--skin-glass);
  box-shadow: var(--skin-shadow), var(--skin-rim);
  backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
}
.overview-metrics .metric.interactive:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -12px rgba(12, 60, 32, .28), var(--skin-rim); }
:is(.overview-metrics, .summary-metrics) .metric-label {
  display: flex; flex-direction: column-reverse; align-items: flex-start; justify-content: flex-end;
  gap: 12px; font-size: 13px; font-weight: 650; color: var(--skin-ink);
}
:is(.overview-metrics, .summary-metrics) .metric-icon {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255, 255, 255, .9); box-shadow: 0 2px 6px rgba(12, 60, 32, .08), inset 0 1px 0 #fff;
}
:is(.overview-metrics, .summary-metrics) .metric-icon .icon { display: block; width: 17px; height: 17px; color: var(--skin-hero-top); }
.metric-value { font-weight: 720; }
.metric-foot { font-size: 12.5px; color: var(--skin-muted); }

/* "Needs attention": deep forest glass with pale-gold detail (the one dark tile) */
.overview-metrics .metric:nth-child(3), .overview-metrics .metric:nth-child(3):hover {
  background: linear-gradient(150deg, rgba(22, 52, 36, .92) 0%, rgba(14, 36, 25, .88) 100%);
  border-color: rgba(255, 255, 255, .14);
  box-shadow: 0 18px 38px -14px rgba(8, 30, 18, .5), inset 0 1px 0 rgba(255, 255, 255, .14);
}
.overview-metrics .metric:nth-child(3) :is(.metric-label, .metric-value, .metric-arrow) { color: #fff; }
.overview-metrics .metric:nth-child(3) .metric-foot { color: #f3c46b; font-weight: 600; }
.overview-metrics .metric:nth-child(3) .metric-icon {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;

@keyframes block-rise { from { opacity: 0; filter: blur(12px); transform: translateY(28px) scale(.97); } to { opacity: 1; filter: blur(0); transform: none; } }

function selectCostSeries(state, range) {

    const events = state.inventoryEvents.filter(event =>
      event.restaurantId === state.restaurantId && event.occurredAt.slice(0, 10) === date);
    const usage = events.filter(event => event.kind === 'usage');
    const waste = events.filter(event => event.kind === 'waste');
    const sumKnownCosts = entries => Math.round(entries.reduce(
      (sum, event) => sum + Math.abs(event.quantityDelta) * (event.unitCostCents ?? 0), 0));
    const isComplete = entries => entries.every(event => Number.isFinite(event.unitCostCents));
    const usageCostComplete = isComplete(usage);
    const wasteCostComplete = isComplete(waste);
    return {
      date,
      usageCents: sumKnownCosts(usage),
      wasteCents: sumKnownCosts(waste),
      usageCostComplete,
      wasteCostComplete,
      costComplete: usageCostComplete && wasteCostComplete,
    };
  });
}

function isAwaitingReceiving(order) {
  return !!order.sentAt && order.fulfillmentStatus !== 'received';

function selectWasteEvents(state, range, ingredientId = '') {
  return state.inventoryEvents.filter(event => {
    if (event.restaurantId !== state.restaurantId || event.kind !== 'waste') return false;
    if (ingredientId && event.ingredientId !== ingredientId) return false;
    if (!range) return true;
    const date = event.occurredAt.slice(0, 10);
    return date >= range.start && date <= range.end;
  }).sort((a, b) => b.occurredAt.localeCompare(a.occurredAt));
}

function summarizeWaste(state, events) {
  const ingredients = new Map(state.ingredients.map(item => [item.id, item]));
  const knownCostByDay = new Map();
  let knownMassKg = 0;
  let missingCost = 0;
  let missingMass = 0;

  for (const event of events) {
    const quantity = Math.abs(event.quantityDelta);
    if (Number.isFinite(event.unitCostCents)) {
      const day = event.occurredAt.slice(0, 10);
      knownCostByDay.set(day, (knownCostByDay.get(day) ?? 0) + quantity * event.unitCostCents);
    } else {
      missingCost++;
    }
    const unitWeight = event.unit === 'kg' ? 1 : ingredients.get(event.ingredientId)?.unitWeightKg;
    if (Number.isFinite(unitWeight)) knownMassKg += quantity * unitWeight;
    else missingMass++;
  }

  return {
    knownCostCents: [...knownCostByDay.values()].reduce((total, cents) => total + Math.round(cents), 0),
    knownMassKg: qty(knownMassKg),
    missingCost,
    missingMass,
  };
}

const wastePlanningGuidance = {
  'preparation loss': 'Review prep quantities and trimming with the kitchen before setting the next order.',
  overproduction: 'Compare prepared quantities with recorded usage before revising the next order.',
  spoilage: 'Review batch expiration, usable stock and the timing of the next delivery.',
  expired: 'Review expiration dates and prioritize the remaining usable batches in the next plan.',
};

function selectWastePlanning(state, range) {
  // OpsCon §7 / N.10: make recorded waste usable in the next planning cycle.
  // Quantities keep their ingredient units. Manager approval still controls ordering.
  const ingredients = new Map(state.ingredients.map(item => [item.id, item]));
  const groups = new Map();
  for (const event of selectWasteEvents(state, range)) {
    const ingredient = ingredients.get(event.ingredientId);
    if (!ingredient || event.unit !== ingredient.unit) continue;
    const quantity = Math.abs(event.quantityDelta);
    if (quantity === 0) continue;
    let group = groups.get(ingredient.id);
    if (!group) {
      group = {
        ingredientId: ingredient.id,
        name: ingredient.name,
        unit: ingredient.unit,
        quantity: 0,
        count: 0,
        latest: event.occurredAt,
        reasons: new Map(),
      };
      groups.set(ingredient.id, group);
    }

    const recordedReason = typeof event.reason === 'string' ? event.reason : '';
    const reason = recordedReason.split(':', 1)[0].trim() || 'Unspecified';
    group.quantity = qty(group.quantity + quantity);
    group.count++;
    group.reasons.set(reason, (group.reasons.get(reason) ?? 0) + 1);
  }

  return [...groups.values()].map(({ reasons, ...group }) => {
    const rankedReasons = [...reasons.entries()].sort((a, b) => b[1] - a[1]);
    const mainReason = rankedReasons[0][0];
    const key = mainReason.toLowerCase();
    const guidance = Object.hasOwn(wastePlanningGuidance, key)
      ? wastePlanningGuidance[key]
      : 'Review the recorded cause and usable stock before approving the next order.';
    return { ...group, reasons: rankedReasons, mainReason, guidance };
  }).sort((a, b) => b.count - a.count || b.latest.localeCompare(a.latest) || a.name.localeCompare(b.name));
}

function paginate(items, page, size) {
  const pages = Math.max(1, Math.ceil(items.length / size));
  const current = Math.min(pages, Math.max(1, Number.isInteger(page) ? page : 1));
  const offset = (current - 1) * size;
  return {
    items: items.slice(offset, offset + size),
    page: current,
    pages,
    start: items.length ? offset + 1 : 0,
    end: Math.min(items.length, offset + size),
    total: items.length,
  };
}

const periodOptions = [
  ['week', 'Last 7 demo days'],
  ['today', 'Today'],
];

function fullDate(value) {
  if (!value) return 'Unknown';
  return new Intl.DateTimeFormat('en-US', {
    month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC',
  }).format(new Date(value.slice(0, 10) + 'T12:00:00Z'));
}

function periodSelect(id, label, value, options = periodOptions) {
  return `<label class="period-control"><span>${esc(label)}</span><select id="${id}" aria-label="${esc(label)}">
    ${options.map(([key, title]) => `<option value="${key}" ${value === key ? 'selected' : ''}>${esc(title)}</option>`).join('')}
  </select></label>`;
}

function periodLabel(range) {
  return range.start === range.end ? fullDate(range.end) : `${fullDate(range.start)} – ${fullDate(range.end)}`;
}

function paginationControls(result, action, label) {
  if (result.pages < 2) return '';
  return `<div class="pagination workflow-pagination" aria-label="${esc(label)} pagination">
    <span>${result.start}–${result.end} of ${result.total} · Page ${result.page} of ${result.pages}</span>
    <div>
      ${button('Previous', action, `data-page="${result.page - 1}" aria-label="Previous ${esc(label)} page" ${result.page === 1 ? 'disabled' : ''}`, 'mini')}
      ${button('Next', action, `data-page="${result.page + 1}" aria-label="Next ${esc(label)} page" ${result.page === result.pages ? 'disabled' : ''}`, 'mini')}
    </div>
  </div>`;
}

function linkedActivity(state) {
  // Preserve the original event history with an explicit destination per row.
  return [
    ...state.inventoryEvents.filter(event => event.restaurantId === state.restaurantId).map(event => ({
      ...event, action: 'ingredient', target: event.ingredientId,
      detail: `${state.ingredients.find(item => item.id === event.ingredientId)?.name ?? 'Ingredient'} · ${amount(Math.abs(event.quantityDelta))} ${event.unit}`,
    })),
    ...state.orders.filter(order => order.restaurantId === state.restaurantId).flatMap(order =>
      order.events.map(event => ({ ...event, action: 'order', target: order.id, detail: `${order.id} · ${order.supplierId}` }))),
    ...state.recoveries.filter(request => request.restaurantId === state.restaurantId).flatMap(request =>
      request.events.map(event => ({ ...event, action: 'recovery', target: request.id, detail: `${request.id} · ${request.partnerId}` }))),
  ].sort((a, b) => b.occurredAt.localeCompare(a.occurredAt));
}

function renderActivityRows(events) {
  if (!events.length) return '<p class="quiet-state">No recorded activity.</p>';
  return events.map(event => `
    <button class="activity-row activity-link" type="button" data-action="${event.action}" data-id="${esc(event.target)}">
      <span class="activity-dot ${event.kind === 'waste' ? 'orange' : ''}"></span>
      <div><strong>${esc(stateLabels[event.kind] ?? event.kind)}</strong><p>${esc(event.detail)}</p></div>
      <time datetime="${esc(event.occurredAt)}">${fullDate(event.occurredAt)}<small>${event.occurredAt.slice(11, 16)}</small></time>
      ${icon('chevron')}
    </button>`).join('');
}

function activityOverlay(state, overlay) {
  const history = paginate(linkedActivity(state), overlay.page, 12);
  return {
    title: 'Activity history',
    sub: 'Inventory, purchase orders and recovery',
    body: renderActivityRows(history.items) + paginationControls(history, 'history-page', 'activity'),
  };
}

function overviewMetric(label, value, caption, symbol, action, attributes = '') {
  const body = `<span class="metric-label">${esc(label)} <span class="metric-icon">${icon(symbol)}</span></span>
    <strong class="metric-value">${value}</strong><span class="metric-foot">${esc(caption)}</span>
    ${action ? icon('arrow', 'metric-arrow') : ''}`;
  return action
    ? `<button class="metric interactive" type="button" data-action="${action}" ${attributes}>${body}</button>`
    : `<div class="metric">${body}</div>`;
}

const healthStatuses = ['healthy', 'expiring', 'low', 'expired', 'unknown'];

function healthSummary(summary, risk) {
  const count = summary.statuses.healthy;
  if (healthStatuses.includes(risk) && summary.statuses[risk] > 0) {
    const label = riskLabels[risk];
    const total = summary.statuses[risk];
    return { risk, number: String(total), label, note: `${total} with primary status ${label}`, link: `View ${label.toLowerCase()}` };
  }
  const percent = summary.total ? (100 * count / summary.total).toFixed(1) + '%' : '—';
  return { risk: '', number: percent, label: summary.total ? 'in good standing' : 'No ingredients',
    note: `${count} ingredients in good standing`, link: 'Explore inventory' };
}

function inventoryHealth(summary, risk) {
  const view = healthSummary(summary, risk);
  const statuses = healthStatuses.filter(key => summary.statuses[key] > 0);
  let start = 0;
  const segments = statuses.map(key => {
    const share = 100 * summary.statuses[key] / summary.total;
    const length = statuses.length > 1 ? share - Math.min(0.7, share * 0.32) : share;
    const path = `<circle class="health-segment" cx="86" cy="86" r="73" pathLength="100"
      stroke-dasharray="${length.toFixed(4)} ${(100 - length).toFixed(4)}" stroke-dashoffset="${(-start).toFixed(4)}"
      data-action="health-select" data-risk="${key}" ${view.risk === key ? 'data-selected=""' : ''}/>`;
    start += share;
    return path;
  }).join('');

  return `<section class="card health-card" data-inventory-health data-health-risk="${view.risk}">
    <div class="card-head">
      <div><h2>A healthy pantry.</h2><p>${summary.total} tracked ingredients · primary stock status</p></div>
      ${button(icon('info'), 'health-info', 'aria-label="How inventory health is calculated" title="How inventory health is calculated"', 'icon-button health-info')}
    </div>
    <div class="card-body health-layout">
      <div class="health-ring">
        <svg viewBox="0 0 172 172" aria-hidden="true">
          <circle class="health-track" cx="86" cy="86" r="73"/>
          <g transform="rotate(-90 86 86)">${segments}</g>
        </svg>
        <div class="health-center"><strong data-health-number>${view.number}</strong><span data-health-label>${view.label}</span></div>
      </div>
      <div class="health-legend" role="group" aria-label="Highlight a primary stock status">
        ${statuses.map(key => `<button class="health-choice" type="button" data-action="health-select" data-risk="${key}" aria-pressed="${key === view.risk}">
          <i class="dot ${key}"></i><span>${riskLabels[key]}</span><strong>${summary.statuses[key]}</strong>
        </button>`).join('')}
      </div>
    </div>
    <div class="card-footer health-footer">
      <span data-health-note aria-live="polite">${view.note}</span>
      <button class="btn link inline-arrow" type="button" data-action="health-inventory" data-risk="${view.risk}">
        <span data-health-link>${view.link}</span>${icon('arrow')}
      </button>
    </div>
  </section>`;
}

function renderActionCenter(summary) {
  const countRisk = risk => summary.items.filter(item => item.risks.includes(risk)).length;
  const tasks = [

    [countRisk('unknown'), 'Check missing dates', 'Find batches with unrecorded expiration dates.', 'filter', 'data-risk="unknown"'],

  </div>`;

function renderCostTrend(series, range, ui, overview = false) {
  const usage = series.reduce((total, point) => total + point.usageCents, 0);
  const waste = series.reduce((total, point) => total + point.wasteCents, 0);
  const incompleteUsage = series.some(point => !point.usageCostComplete);
  const incompleteWaste = series.some(point => !point.wasteCostComplete);
  return `<section class="card trend-card ${overview ? 'overview-trend' : 'report-trend'}">
    <div class="card-head chart-heading">
      <div><h2>${overview ? 'Where your ingredients go.' : 'Usage & waste cost'}</h2>
        <div class="trend-total"><strong data-usage-total="${usage}" aria-label="${money(usage)}${incompleteUsage ? ' known' : ''} usage cost"><span aria-hidden="true">${money(usage)}</span></strong>
          <span>${incompleteUsage ? 'Known usage cost' : 'Usage cost'} · ${periodLabel(range)}</span>
        </div>
      </div>
      ${overview ? costPeriodSwitch(ui.reportPeriod) : ''}
    </div>

function renderReportsPage(state, ui) {

  const usageComplete = report.series.every(point => point.usageCostComplete);
  const wasteComplete = report.series.every(point => point.wasteCostComplete);
  const actions = costPeriodSwitch(ui.reportPeriod) + button('Export data', 'export', '', 'secondary', 'download');

  return heading('', 'Reports', 'Review waste, ingredient availability and recorded costs together.', actions) + `
    <div class="report-range">${icon('calendar')} <strong>${periodLabel(range)}</strong><span>${report.coverage} of ${report.days} days observed</span><span>${report.coverage ? amount(report.covers) + ' recorded diner covers' : 'Diner covers unavailable'}</span></div>
    <div class="metrics report-metrics summary-metrics">
      ${overviewMetric('Waste per 100 covers', report.wastePer100.value === null ? 'Not calculable' : report.wastePer100.value.toFixed(2) + ' <small>kg</small>', report.wastePer100.reason ?? `${amount(report.wasteKg)} kg waste ÷ ${amount(report.covers)} covers × 100`, 'leaf')}
      ${overviewMetric('Stockout rate', report.stockoutRate.value === null ? 'Not calculable' : report.stockoutRate.value.toFixed(2) + '<small>%</small>', report.stockoutRate.reason ?? `${report.unavailable} of ${report.opportunities} observed opportunities`, 'alert')}

// When a custom <select> is open the focused element is one of its <option>s; treat the
// <select> itself as the focused control so focus can be restored after a re-render.
const focusedControl = () => {
  const element = document.activeElement;
  return element?.closest?.('select') ?? element;
};
const selectIsOpen = () => {
  try { return !!root.querySelector('select:open'); } catch { return false; }
};

  const oldDialog = root.querySelector('.dialog-body');
  if (oldDialog && ui.lastOverlay) ui.lastOverlay.scrollTop = oldDialog.scrollTop;

  ui.lastPage = ui.page;
  ui.lastOverlay = ui.overlay;
  if (ui.animateCharts) ui.chartsPlayed = true;
  ui.periodChanged = false;
  document.body.classList.toggle('dialog-open', !!ui.overlay);
  renderToast();
  placeNavPill(pageChanged);
  if (pageChanged) {
    const main = root.querySelector('main');
    staggerCards(main);
    rollNumbers(main);

  if (detailsOpen) root.querySelector('.chart-details').open = true;

    dialog.querySelector('.dialog-body').scrollTop = ui.overlay.scrollTop ?? 0;
    updateFormPreview(dialog.querySelector('form'));

  const target = dialog ? matchFocusTarget(dialogControls(dialog), hint)
    : matchFocusTarget(dialogControls(root.querySelector('.app-shell')), hint);
  if (target) {
    target.focus({ preventScroll: true });
    if (selection.every(Number.isInteger) && ['text', 'search'].includes(target.type)) {
      target.setSelectionRange(...selection);
    }
  }
}

const prefersReducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Page choreography ----------
// Leave: the visible blocks of the current page dissolve one after another (bottom first,
// 35 ms apart) before the next page is rendered.
// Enter: the new blocks condense out of a blur left → right / top → bottom (55 ms apart);
// the page heading arrives just after the first cards; large panels come last, from lower down;
// numbers roll and the health ring draws only once their own card has landed.
const ENTER_TARGETS = '.page-heading, .page-segments, .inventory-toolbar, .list-tools, .table-meta, .report-range, .notice, .metric, .card, .table-card, .overview-categories';
const RISE_TARGETS = '.trend-card, .table-card, .planning-panel, .activity-card, .overview-categories';
const ENTER_MS = 440;
const RISE_MS = 520;

function topLevelBlocks(scope) {
  return [...scope.querySelectorAll(ENTER_TARGETS)].filter(element => !element.parentElement.closest(ENTER_TARGETS));
}

function staggerCards(scope) {
  if (!scope || prefersReducedMotion()) return;
  let index = 0;
  for (const element of topLevelBlocks(scope)) {
    const heading = element.matches('.page-heading');
    const rise = element.matches(RISE_TARGETS);
    let delay = heading ? 60 + 1.6 * 55 : 60 + Math.min(index++, 10) * 55;
    if (rise) delay += 70;
    element.dataset.enterDelay = String(Math.round(delay));
    element.style.setProperty('--d', Math.round(delay) + 'ms');
    element.classList.add('card-enter');
    if (rise) element.classList.add('enter-rise');
  }
}

function enterEnd(card) {
  if (!card) return 300;
  return Number(card.dataset.enterDelay) + (card.classList.contains('enter-rise') ? RISE_MS : ENTER_MS);
}

function leavePage(done) {
  const main = root.querySelector('main');
  if (!main || prefersReducedMotion()) { done(); return; }
  const visible = topLevelBlocks(main)
    .map(element => ({ element, rect: element.getBoundingClientRect() }))
    .filter(({ rect }) => rect.bottom > 0 && rect.top < innerHeight)
    .sort((a, b) => b.rect.top - a.rect.top || b.rect.left - a.rect.left);
  visible.forEach(({ element }, order) => {
    element.classList.remove('card-enter', 'enter-rise');
    element.style.setProperty('--o', Math.min(order, 4) * 30 + 'ms');
    element.classList.add('card-leave');
  });
  const total = visible.length ? 190 + Math.min(visible.length - 1, 4) * 30 + 20 : 0;
  ui.leaveTimer = setTimeout(done, total);
}

// ---------- Health ring entrance ----------
// Segments grow one after another from 12 o'clock (green, then orange, then red), each ending
// with a small stroke "breath"; each legend row appears as its segment starts.
function animateHealthRing(scope) {
  const panel = scope?.querySelector('[data-inventory-health]');
  if (!panel || prefersReducedMotion() || typeof panel.animate !== 'function') return;
  let at = enterEnd(panel.closest('[data-enter-delay]')) - 60;
  const legend = [...panel.querySelectorAll('.health-choice')];
  [...panel.querySelectorAll('.health-segment')].forEach((segment, index) => {
    const [length, gap] = (segment.getAttribute('stroke-dasharray') ?? '0 100').trim().split(/\s+/).map(Number);
    const duration = Math.round(Math.max(280, Math.min(900, length * 10)));
    segment.animate(
      [{ strokeDasharray: `0 100` }, { strokeDasharray: `${length} ${gap}` }],
      { duration, delay: at, easing: 'cubic-bezier(.3, .7, .2, 1)', fill: 'backwards' },
    );
    segment.animate(
      [{ strokeWidth: '13px' }, { strokeWidth: '17px' }, { strokeWidth: '13px' }],
      { duration: 320, delay: at + duration - 80, easing: 'ease-out' },
    );
    legend[index]?.animate(
      [{ opacity: 0, transform: 'translateX(-8px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
      { duration: 340, delay: at, easing: 'cubic-bezier(.2, .8, .2, 1)', fill: 'backwards' },
    );
    at += duration - 40;
  });
}

// ---------- Odometer roll ----------
// Every digit is a clipped vertical strip of 0–9 (three cycles, drawn with ::before so no text is
// added to the page). It starts on 0, so "$35,438.36" first reads "$00,000.00", then each strip
// slides one full turn and lands on its digit. Symbols ($ , . % kg) never move. Digits start
// left → right 35 ms apart, once their card has landed. Afterwards the original text node is
// simply left visible again.
const ROLL_TARGETS = '.metric-value, .health-center strong, .task-row > strong, .recovery-amount';
const ROLL_MS = 1100;

function rollNumbers(scope) {
  if (!scope || prefersReducedMotion()) return;
  const reels = [];
  for (const element of scope.querySelectorAll(ROLL_TARGETS)) {
    const card = element.closest('[data-enter-delay]');
    const startAt = enterEnd(card) + 80;
    let digitIndex = 0;
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    for (let node = walker.nextNode(); node; node = walker.nextNode()) if (/\d/.test(node.nodeValue)) nodes.push(node);
    for (const node of nodes) {
      // The original text node stays exactly where it is (only made transparent inside an inline
      // span), so spacing, letter-spacing and the units after it never move. The reel is laid
      // over it like a sticker.
      const textColor = getComputedStyle(node.parentElement).color;
      const wrapper = document.createElement('span');
      wrapper.className = 'odo';
      const reel = document.createElement('span');
      reel.className = 'odo-reel';
      reel.setAttribute('aria-hidden', 'true');
      const strips = [];
      for (const char of node.nodeValue) {
        if (/\d/.test(char)) {
          const column = document.createElement('span');
          column.className = 'odo-col';
          const strip = document.createElement('span');
          strip.className = 'odo-strip';
          strip.innerHTML = Array.from({ length: 30 }, (_, n) => `<span data-d="${n % 10}"></span>`).join('');
          column.append(strip);
          reel.append(column);
          strips.push({ strip, digit: Number(char), delay: startAt + digitIndex++ * 35 });
        } else {
          const symbol = document.createElement('span');
          symbol.className = 'odo-sym';
          symbol.dataset.s = char;
          reel.append(symbol);
        }
      }
      node.replaceWith(wrapper);
      wrapper.append(node, reel);
      const box = wrapper.getClientRects()[0];
      if (!box) { wrapper.replaceWith(node); continue; }   // not rendered (hidden or collapsed)
      reel.style.color = textColor;
      // Each digit window is the line height plus headroom (so bold glyphs are never clipped).
      // A glyph is centred in its window, so shifting the reel up by half the difference between
      // the window and the text's content area puts every digit exactly on the original glyph.
      // The card may still be scaled by its entry animation, so divide that scale back out.
      const style = getComputedStyle(wrapper);
      const cardTransform = card ? getComputedStyle(card).transform : 'none';
      const scale = cardTransform && cardTransform !== 'none' ? new DOMMatrix(cardTransform).a : 1;
      const contentHeight = box.height / scale;
      const lineHeight = style.lineHeight.endsWith('px') ? parseFloat(style.lineHeight) : contentHeight;
      const step = lineHeight + 2 * Math.ceil(parseFloat(style.fontSize) * 0.2);
      reel.style.setProperty('--h', step + 'px');
      reel.style.top = -(step - contentHeight) / 2 + 'px';
      reels.push({ wrapper, original: node, strips });
    }
  }
  if (!reels.length) return;
  void scope.offsetHeight;   // commit the "all zeros" start state so the transition has a starting point
  for (const { strips } of reels) {
    for (const { strip, digit, delay } of strips) {
      strip.style.transition = `transform ${ROLL_MS}ms cubic-bezier(.16, 1, .3, 1) ${delay}ms`;
      strip.style.transform = `translateY(calc(var(--h) * -${10 + digit}))`;
    }
  }
  const longest = Math.max(...reels.flatMap(reel => reel.strips.map(strip => strip.delay)));
  setTimeout(() => {
    for (const { wrapper, original } of reels) if (wrapper.isConnected) wrapper.replaceWith(original);
  }, longest + ROLL_MS + 80);
}

// ---------- Sidebar rail ----------
// Open after the pointer rests in the rail for 90 ms, close 220 ms after it leaves. The state
// lives in ui.railOpen, so re-rendering after a click keeps the rail open under the pointer.
function setRail(open) {
  clearTimeout(ui.railTimer);
  if (ui.railOpen === open) return;
  ui.railTimer = setTimeout(() => {
    ui.railOpen = open;
    root.querySelector('.app-shell')?.classList.toggle('rail-open', open);
  }, open ? 90 : 220);
}

// ---------- Sidebar pill ----------
// The pill only moves vertically; its width follows the rail through CSS (left/right), so it
// stays correct while the rail expands or the window is resized. Inside it, an ink copy of the
// menu moves the opposite way, keeping dark text exactly under the pill.
function setPill(pill, y, height) {
  pill.style.height = height + 'px';
  pill.style.transform = `translateY(${y}px)`;
  pill.firstElementChild.style.transform = `translateY(${-y}px)`;
}

function placeNavPill(animate) {
  const nav = root.querySelector('.sidebar nav');
  const pill = nav?.querySelector('.nav-pill');
  if (!pill) return;
  const active = nav.querySelector('.nav-item.active[data-action]');
  if (!active) { pill.style.opacity = '0'; return; }
  pill.style.opacity = '';
  const ink = pill.firstElementChild;
  const y = active.offsetTop;
  if (animate && ui.navPillY != null && ui.navPillY !== y && !prefersReducedMotion()) {
    pill.style.transition = ink.style.transition = 'none';
    setPill(pill, ui.navPillY, active.offsetHeight);
    void pill.offsetWidth;
    pill.style.transition = ink.style.transition = '';
  } else {
    pill.style.transition = ink.style.transition = 'none';
    setPill(pill, y, active.offsetHeight);
    void pill.offsetWidth;
    pill.style.transition = ink.style.transition = '';
  }
  setPill(pill, y, active.offsetHeight);
  ui.navPillY = y;
}

// Start the pill on its way the moment a page is chosen, before the old page has left.
function movePillTo(page) {
  const nav = root.querySelector('.sidebar nav');
  const pill = nav?.querySelector('.nav-pill');
  const item = nav?.querySelector(`.nav-item[data-action="${page}"]`);
  if (!pill || !item) return;
  setPill(pill, item.offsetTop, item.offsetHeight);
  ui.navPillY = item.offsetTop;
}

function setHealthRisk(risk) {
  const panel = root.querySelector('[data-inventory-health]');
  const next = panel.dataset.healthRisk === risk ? '' : risk;
  const state = healthSummary(selectOverview(service.getSnapshot()), next);
  ui.healthRisk = state.risk;
  panel.dataset.healthRisk = state.risk;
  for (const segment of panel.querySelectorAll('.health-segment')) {
    segment.toggleAttribute('data-selected', segment.dataset.risk === state.risk);
  }
  for (const button of panel.querySelectorAll('.health-choice')) {
    button.setAttribute('aria-pressed', String(button.dataset.risk === state.risk));
  }
  panel.querySelector('[data-health-number]').textContent = state.number;
  panel.querySelector('[data-health-label]').textContent = state.label;
  panel.querySelector('[data-health-note]').textContent = state.note;
  panel.querySelector('[data-health-link]').textContent = state.link;

function setChartDay(date) {
  ui.chartDate = ui.chartDate === date ? '' : date;
  const panel = root.querySelector('.paired-chart');
  let label = 'Day details dismissed.';
  for (const day of panel.querySelectorAll('.cost-day')) {
    const selected = day.dataset.date === ui.chartDate;
    day.setAttribute('aria-pressed', String(selected));
    if (selected) label = day.getAttribute('aria-label');
  }
  panel.querySelector('[data-chart-announcement]').textContent = label;
}

function setCostPeriod(period) {
  if (!periodOptions.some(([key]) => key === period) || ui.reportPeriod === period) return;
  const previous = root.querySelector('[data-usage-total]');
  const from = Number(previous?.dataset.displayedCents ?? previous?.dataset.usageTotal);
  ui.reportPeriod = period;
  ui.chartDate = '';
  ui.periodChanged = true;
  render();
  const target = root.querySelector('[data-usage-total]');
  const to = Number(target.dataset.usageTotal);
  if (!Number.isFinite(from) || from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const value = target.querySelector('span');
  const start = performance.now();
  value.textContent = money(from);
  target.dataset.displayedCents = String(from);
  function step(now) {
    if (!target.isConnected) return;
    const progress = Math.min(1, Math.max(0, (now - start) / 380));
    const cents = Math.round(from + (to - from) * (1 - (1 - progress) ** 3));
    value.textContent = money(cents);
    target.dataset.displayedCents = String(cents);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function updateFormPreview(form) {
  const estimate = form?.querySelector('[data-draft-estimate]');
  if (estimate) {
    const quantities = [...form.querySelectorAll('input[data-draft-price]')];
    estimate.textContent = quantities.some(input => !input.value || !input.validity.valid)
      ? 'Check quantities'
      : purchaseEstimate(quantities.map(input => ({
        managerQty: Number(input.value),
        unitCostCents: input.dataset.draftPrice === '' ? null : Number(input.dataset.draftPrice),
      })));
  }
  const preview = form?.querySelector('[data-quantity-preview]');
  if (!preview) return;
  const input = form.elements.quantity;
  const next = preview.querySelector('[data-stock-result]');
  next.textContent = input?.value && input.validity.valid
    ? `${amount(qty(Number(preview.dataset.current) + Number(preview.dataset.direction) * Number(input.value)))} ${preview.dataset.unit}`
    : 'Check quantity';
}

function handleClassroomAction(action, element) {
  switch (action) {
    case 'health-select':
      setHealthRisk(element.dataset.risk);
      return true;
    case 'health-inventory':
      navigate('inventory', element.dataset.risk ? { risk: element.dataset.risk, primaryRisk: true } : {});
      return true;
    case 'inventory-value':
    case 'health-info':
      openOverlay({ type: action });
      return true;
    case 'chart-day':
      setChartDay(element.dataset.date);
      return true;
    case 'cost-period':
      setCostPeriod(element.dataset.period);
      return true;
    case 'purchase-drafts':
      ui.purchaseTab = 'drafts';
      ui.orderFilter = 'all';
      navigate('purchasing');
      return true;
    case 'orders':
      ui.purchaseTab = 'orders';
      ui.orderFilter = element.dataset.filter === 'receiving' ? 'receiving' : 'all';
      navigate('purchasing');
      return true;
    case 'activity-history':
      openOverlay({ type: 'history', page: 1 });
      return true;
    case 'history-page':
    case 'movement-page':
      ui.overlay.page = Number(element.dataset.page);
      render();
      return true;
    case 'waste-page':
      ui.wastePage = Number(element.dataset.page);
      render();
      return true;
    case 'waste-records':
      ui.wasteTab = 'waste';
      ui.wastePeriod = element.dataset.period;
      ui.wasteIngredient = element.dataset.ingredient;
      ui.wastePage = 1;
      navigate('waste');
      return true;
    case 'clear-waste-filter':
      ui.wasteIngredient = '';
      ui.wastePage = 1;
      render();
      return true;
    default:
      return false;
  }
}

function eligibleRecoveryBatches(state, ingredientId) {
  return state.batches.filter(batch =>
    batch.restaurantId === state.restaurantId &&
    batch.ingredientId === ingredientId &&
    batch.expiresOn && batch.expiresOn >= state.demoDate &&
    batch.quantity > reservedForBatch(state, batch.id));
}

function recoveryForm(state, overlay) {
  const ingredientId = overlay.values?.ingredientId ?? overlay.ingredientId ?? state.ingredients[0].id;
  const item = state.ingredients.find(ingredient => ingredient.id === ingredientId);
  const batches = eligibleRecoveryBatches(state, item.id);
  const selected = batches.find(batch => batch.id === overlay.values?.batchId) ?? batches[0];
  const maximum = selected ? qty(selected.quantity - reservedForBatch(state, selected.id)) : 0;
  const step = item.unit === 'kg' ? 0.001 : 1;
  return {
    title: 'New recovery request',
    sub: 'Arrange pickup for a usable surplus batch',
    body: `<form data-form="recovery-request">
      ${selectField(overlay, 'ingredientId', 'Ingredient', state.ingredients.map(ingredient => ({ value: ingredient.id, label: ingredient.name })), item.id)}
      ${selected ? `${selectField(overlay, 'batchId', 'Batch', batches.map(batch => ({
        value: batch.id, label: `${batch.id} · ${amount(qty(batch.quantity - reservedForBatch(state, batch.id)))} ${item.unit} available`,
      })), selected.id)}
        ${field(overlay, 'quantity', `Quantity (${item.unit})`, Math.min(1, maximum), 'number', `required min="${step}" max="${maximum}" step="${step}"`)}`
        : '<p class="notice compact">This ingredient has no unreserved stock in a known, unexpired batch.</p>'}
      ${field(overlay, 'partnerId', 'Recovery partner', 'Community Food Recovery', 'text', 'required maxlength="120"')}
      ${field(overlay, 'requestedWindow', 'Pickup window', 'Today, 14:00–16:00', 'text', 'required maxlength="120"')}
      ${noteField(overlay, 'note', 'Coordination notes', '', false)}
      ${selected ? stockPreview('Available after reservation', maximum, item.unit, -1) : ''}
      <p class="field-help">The request reserves the entered quantity. Record collection after pickup.</p>
      <div class="form-footer">
        ${button('Cancel', 'close-overlay')}
        <button type="submit" class="btn primary" ${selected ? '' : 'disabled'}>Create request</button>
      </div>
    </form>`,
  };
}

const root=document.getElementById('app');
const service=createDemoService({getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)});
const ui = {
  page: 'overview', lastPage: null, pageNumber: 1, pageSize: 12, filter: {},
  purchaseTab: 'drafts', orderFilter: 'all',
  wasteTab: 'waste', wastePeriod: 'all', wasteIngredient: '', wastePage: 1,
  reportPeriod: 'week', periodChanged: false, healthRisk: '', chartDate: '', overlay: null, lastOverlay: null, error: '',
  dirty: false, discard: false, notice: null, animateCharts: false, chartsPlayed: false,
  committing: false,
};
let toastTimer;
const operation=()=>crypto.randomUUID?.()??`op-${Date.now()}-${Math.random()}`;
function toast(message,error=false){ui.notice={message,error};renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.notice=null;renderToast()},3000);}
function renderToast(){const el=document.getElementById('toast-region');if(el)el.innerHTML=ui.notice?`<div class="toast ${ui.notice.error?'error':''}" role="${ui.notice.error?'alert':'status'}">${icon(ui.notice.error?'alert':'check')}<span>${esc(ui.notice.message)}</span></div>`:'';}
function snapshotForm(){const form=root.querySelector('[role="dialog"] form');if(form&&ui.overlay)ui.overlay.values=captureInputs(form.elements);}
function focusDialog(hint) {
  const overlay = ui.overlay;
  requestAnimationFrame(() => {
    if (ui.overlay !== overlay) return;
    const dialog = root.querySelector('[role="dialog"]');
    const fields = dialog?.querySelector('input:not([type="hidden"]), select, textarea');
    (matchFocusTarget(dialogControls(dialog), hint) ?? fields ?? dialog?.querySelector('button') ?? dialog)
      ?.focus({ preventScroll: true });
  });
}

function openOverlay(overlay, back = null) {
  const returnFocus = focusHint(focusedControl());
  const pageFocus = ui.overlay?.pageFocus ?? returnFocus;
  ui.overlay = { ...overlay, operationId: operation(), returnFocus, pageFocus, back };
  ui.error = '';
  ui.dirty = false;
  ui.discard = false;
  render();
  focusDialog();
}

function closeOverlay(force = false) {
  const closing = ui.overlay;
  if (!closing) return;
  if (ui.dirty && !force) {
    snapshotForm();
    closing.editFocus = focusHint(focusedControl());
    ui.discard = true;
    render();
    requestAnimationFrame(() => {
      if (ui.discard && ui.overlay === closing) root.querySelector('[data-action="keep-editing"]')?.focus();
    });
    return;
  }
  ui.overlay = closing.back;
  ui.error = '';
  ui.dirty = false;
  ui.discard = false;
  render();
  if (closing.back) {
    focusDialog(closing.returnFocus);
  } else {
    requestAnimationFrame(() => {
      if (ui.overlay) return;
      (matchFocusTarget(dialogControls(root.querySelector('.app-shell')), closing.pageFocus)
        ?? root.querySelector('.nav-item.active'))?.focus({ preventScroll: true });
    });
  }
}
function navigate(page, filter) {
  const go = () => {
    ui.page = page; ui.overlay = null; ui.error = ''; ui.dirty = false; ui.discard = false;
    if (page === 'inventory') { ui.filter = filter ?? {}; ui.pageNumber = 1; }
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  };
  // While the old page is still dissolving, a new choice simply replaces the destination.
  if (ui.leaving) { ui.leaving = go; movePillTo(page); return; }
  if (page === ui.page || ui.overlay || prefersReducedMotion()) { go(); return; }
  ui.leaving = go;
  movePillTo(page);
  leavePage(() => { const next = ui.leaving; ui.leaving = null; next?.(); });
}
function commit(work, message) {
  ui.committing = true;
  let result;
  try {
    result = service.commit(work);
  } finally {
    ui.committing = false;
  }
  if (!result.ok) {
    snapshotForm();
    ui.error = result.message;
    if (ui.overlay) render();
    else toast(result.message, true);
    return null;
  }

  ui.dirty = false;
  ui.error = '';
  if (ui.overlay) ui.overlay.values = undefined;
  render();
  if (message) toast(message);
  return result.value;
}
function download(text,name,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id;if(action==='backdrop'){if(e.target===el)closeOverlay();return;}e.preventDefault();const s=service.getSnapshot();
if(handleClassroomAction(action,el))return;
if(['overview','inventory','purchasing','waste','reports'].includes(action)){navigate(action);return;}if(action==='filter'){navigate('inventory',{risk:el.dataset.risk});return;}if(action==='category'){navigate('inventory',{category:el.dataset.category});return;}if(action==='clear-filters'){ui.filter={};ui.pageNumber=1;render();return;}if(action==='prev'||action==='next'){ui.pageNumber+=action==='next'?1:-1;render();return;}if(action==='purchase-tab'){ui.purchaseTab=el.dataset.tab;render();return;}if(action==='waste-tab'){ui.wasteTab=el.dataset.tab;render();return;}if(action==='ingredient'){openOverlay({type:'ingredient',id,page:1},ui.overlay?.type==='history'?ui.overlay:null);return;}if(action==='record'){openOverlay({type:'record',kind:el.dataset.kind,ingredientId:el.dataset.ingredient??'ing-001'},ui.overlay?.type==='ingredient'?ui.overlay:null);return;}if(action==='draft'){openOverlay({type:'draft',id});return;}if(action==='order'){openOverlay({type:'order',id},ui.overlay?.type==='history'?ui.overlay:null);return;}if(action==='recovery'){openOverlay({type:'recovery',id},ui.overlay?.type==='history'?ui.overlay:null);return;}if(action==='new-recovery'){openOverlay({type:'new-recovery'});return;}if(action==='close-overlay'){closeOverlay();return;}if(action==='keep-editing'){ui.discard=false;render();focusDialog(ui.overlay.editFocus);return;}if(action==='discard'){closeOverlay(true);return;}if(action==='review-approval'){if(ui.dirty){ui.error='Save your quantity changes before reviewing approval.';snapshotForm();render();return;}openOverlay({type:'approval',id},ui.overlay);return;}if(action==='back-draft'){closeOverlay(true);return;}if(action==='approve-send'){const approved=commit(x=>approveDraft(x,id,Number(el.dataset.version),ui.overlay.operationId));if(approved){const order=approved.orders.find(o=>o.sourceDraftId===id);const sent=commit(x=>sendApprovedOrder(x,order.id,`send-${order.id}`));ui.purchaseTab='orders';ui.page='purchasing';openOverlay({type:'order',id:order.id});toast(sent?'Purchase approved and sent to simulated supplier.':'Order approved. Sending needs to be retried.',!sent);}return;}if(action==='send-order'){if(commit(x=>sendApprovedOrder(x,id,`send-${id}`),'Approved order sent to simulated supplier.'))render();return;}if(action==='receive-order'){const x=s.orders.find(o=>o.id===id),line=x.approvedLines.find(l=>l.managerQty>(x.receivedQuantities[l.ingredientId]??0));if(line)openOverlay({type:'record',kind:'receipt',ingredientId:line.ingredientId,orderId:id},ui.overlay);return;}if(action==='new-draft-from-order'){const next=commit(x=>createDraftFromOrder(x,id,ui.overlay.operationId+'-followup'));if(next){ui.page='purchasing';ui.purchaseTab='drafts';openOverlay({type:'draft',id:next.drafts.at(-1).id});toast('New draft created from current inventory. The approved order is unchanged.');}return;}if(action==='refresh-draft'){if(ui.dirty){ui.error='Save or discard quantity changes before recalculating.';snapshotForm();render();return;}const d=s.drafts.find(d=>d.id===id);commit(x=>refreshDraft(x,id,d.version),'Recommendation refreshed from current inventory.');return;}if(action==='refresh-drafts'){let latest=s;for(const d of s.drafts.filter(d=>d.status==='draft')){const next=commit(x=>refreshDraft(x,d.id,d.version));if(!next)return;latest=next;}toast('Draft recommendations refreshed from current inventory.');return;}if(action==='collect'){if(commit(x=>recordCollection(x,id,`collect-${id}`),'Collection recorded. Inventory updated once.'))render();return;}if(action==='cancel-recovery'){if(commit(x=>cancelRecovery(x,id,`cancel-${id}`),'Request cancelled and reservation released.'))render();return;}if(action==='confirm-cancel'){if(commit(x=>cancelRecovery(x,id,`cancel-${id}`),'Request cancelled and reservation released.')){openOverlay({type:'recovery',id});}return;}if(action==='demo'){openOverlay({type:'demo'});return;}if(action==='reset'){openOverlay({type:'reset'});return;}if(action==='confirm-reset'){const result=service.resetDemo();if(result.ok){ui.page='overview';ui.overlay=null;ui.filter={};ui.purchaseTab='drafts';ui.wasteTab='waste';ui.wastePeriod='all';ui.wasteIngredient='';ui.wastePage=1;ui.reportPeriod='week';ui.chartDate='';ui.healthRisk='';ui.orderFilter='all';ui.chartsPlayed=false;ui.error='';ui.dirty=false;render();toast('Demo reset to the original restaurant dataset.');}else{ui.error=result.message;render();}return;}if(action==='export'){download(exportDemoState(s),`PANTRI_demo_${s.demoDate}.json`);toast('Demo data exported with records and approval snapshots.');return;}if(action==='export-raw'){download(service.getRaw()??'No saved data','PANTRI_saved_recovery.txt','text/plain');return;}if(action==='reload'){if(ui.dirty&&!window.confirm('Reload the latest saved data and discard your unsaved form changes?'))return;ui.overlay=null;ui.dirty=false;ui.error='';ui.discard=false;if(service.reload())toast('Latest saved data loaded.');return;}});
root.addEventListener('input', event => {
  const input = event.target;
  if (input.id === 'inventory-search') {
    ui.filter.query = input.value;
    ui.pageNumber = 1;
    render();
    return;
  }
  const form = input.closest('[role="dialog"] form');
  if (form) {
    ui.dirty = true;
    updateFormPreview(form);
  }
});
root.addEventListener('change',e=>{const id=e.target.id;if(id==='category-filter'){ui.filter.category=e.target.value;ui.pageNumber=1;render();}else if(id==='risk-filter'){ui.filter.risk=e.target.value;delete ui.filter.primaryRisk;ui.pageNumber=1;render();}else if(id==='page-size'){ui.pageSize=Number(e.target.value);ui.pageNumber=1;render();}else if (id === 'order-filter') {
  ui.orderFilter = e.target.value;
  render();
} else if (id === 'waste-period') {
  ui.wastePeriod = e.target.value;
  ui.wastePage = 1;
  render();
}else if(e.target.name==='ingredientId'&&ui.overlay){snapshotForm();const values=ui.overlay.values;ui.overlay.ingredientId=values.ingredientId;delete values.batchId;delete values.quantity;delete values.countedQuantity;delete values.unitCost;delete values.expiresOn;ui.dirty=true;render({ capture: false });}else if (e.target.name === 'batchId' && ui.overlay?.type === 'record' && ui.overlay.kind === 'count') {
  snapshotForm();
  delete ui.overlay.values.countedQuantity;
  render({ capture: false });
} else if (e.target.name === 'batchId' && ui.overlay?.type === 'new-recovery') {
  snapshotForm();
  render();
}});
root.addEventListener('submit',e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;if(!kind)return;const values=Object.fromEntries(new FormData(form)),s=service.getSnapshot(),o=ui.overlay;try{if(kind==='inventory-record'){const i=s.ingredients.find(i=>i.id===values.ingredientId);const command={kind:o.kind,operationId:o.operationId,ingredientId:i.id,batchId:values.batchId,unit:i.unit,quantity:Number(values.quantity),countedQuantity:Number(values.countedQuantity),expiresOn:values.expiresOn||null,unitCostCents:values.unitCost?.trim()?Math.round(Number(values.unitCost)*100):null,orderId:o.orderId,reason:(values.reason??'')+(values.note?`: ${values.note}`:'')};if(commit(x=>applyInventoryCommand(x,command),'Inventory record saved.'))closeOverlay(true);}else if(kind==='draft'){const d=s.drafts.find(d=>d.id===o.id);commit(x=>editDraft(x,o.id,Number(values.version),d.lines.map(l=>({ingredientId:l.ingredientId,managerQty:Number(values['qty_'+l.ingredientId])}))),'Draft saved. Approval is still required.');}else if(kind==='supplier'){commit(x=>recordSupplierEvent(x,{id:o.operationId+'-'+operation(),restaurantId:s.restaurantId,transactionId:o.id,kind:values.kind,occurredAt:eventTime(s),note:values.note}),'Simulated supplier response recorded. Stock is unchanged.');}else if(kind==='recovery-request'){if(commit(x=>requestRecovery(x,{...values,quantity:Number(values.quantity)},o.operationId),'Recovery requested. Quantity is reserved.')){const id=service.getSnapshot().recoveries.at(-1).id;ui.wasteTab='recovery';ui.page='waste';openOverlay({type:'recovery',id});}}else if(kind==='recovery-response'){commit(x=>recordRecoveryEvent(x,{id:o.operationId+'-'+operation(),restaurantId:s.restaurantId,transactionId:o.id,kind:values.kind,occurredAt:eventTime(s),note:values.note}),'Simulated partner response recorded. Collection remains separate.');}}catch(error){snapshotForm();ui.error=error.message;render();}});
document.addEventListener('keydown', e => {
  // An open custom dropdown handles its own Escape/Tab; do not let them close the drawer.
  if ((e.key === 'Escape' || e.key === 'Tab') && selectIsOpen()) return;
  if (!ui.overlay) {
    if (e.key === 'Escape' && ui.chartDate && root.querySelector('.paired-chart')) setChartDay(ui.chartDate);
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); return; }
  if (e.key === 'Tab') {
    const target = tabBoundaryTarget(dialogControls(root.querySelector('[role="dialog"]')), focusedControl(), e.shiftKey);
    if (target) { e.preventDefault(); target.focus(); }
  }
});
window.addEventListener('resize', () => placeNavPill(false));
// Any pointer movement decides the rail: inside the sidebar keeps it open, anywhere else closes it.
root.addEventListener('mouseover', e => setRail(!!e.target.closest?.('.sidebar')));
document.documentElement.addEventListener('mouseleave', () => setRail(false));
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)service.markExternalChange();});
service.subscribe(() => { if (!ui.committing) render(); });
render();
</script></body></html>
